<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steal a Pet</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10131b;font-family:monospace;color:#fff}#game{position:relative;width:100vw;height:100vh;background:#79c9ef}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:7px;flex-wrap:wrap;z-index:5}.pill,.panel{background:#171923e8;border:3px solid #08090d;box-shadow:4px 4px 0 #0008;padding:7px 10px}.pill{font-weight:bold}.panel{position:absolute;z-index:5}.right{right:10px;top:10px;width:265px}.right h3{margin:0 0 7px;color:#ffe66d}.right button{font-family:inherit;font-weight:bold;margin:2px;padding:7px 8px;border:2px solid #08090d;background:#4d7cff;color:#fff;cursor:pointer;box-shadow:2px 2px 0 #000}.right button:active{transform:translate(2px,2px);box-shadow:none}.help{left:10px;bottom:10px;max-width:380px;font-size:12px;line-height:1.35}.msg{left:50%;top:12px;transform:translateX(-50%);min-width:280px;text-align:center;display:none;color:#ffe66d}.petList{right:10px;bottom:10px;width:265px;max-height:38vh;overflow:auto}.petRow{display:flex;justify-content:space-between;border-bottom:2px solid #383b4a;padding:5px 0;font-size:12px}.small{font-size:11px;color:#cbd1e2}.bar{height:8px;background:#333;margin-top:5px;border:2px solid #07080c}.bar i{display:block;height:100%;background:#ffe66d;width:0}.warning{color:#ff8b8b}@media(max-width:700px){.right,.petList{width:210px}.help{max-width:260px;font-size:10px}.pill{font-size:11px}}
</style></head><body><div id="game"><canvas id="canvas"></canvas>
<div class="hud"><div class="pill">💰 $<span id="cash">100</span></div><div class="pill">🥚 <span id="eggState">No Egg</span></div><div class="pill">🐾 <span id="petCount">0</span>/<span id="capacity">3</span></div><div class="pill">⚡ <span id="speed">1.00</span>x</div><div class="pill">💵 +$<span id="income">0</span>/s</div></div>
<div class="panel right"><h3>STEAL A PET</h3><button onclick="equipBest()">⭐ EQUIP BEST</button><button onclick="buySlot()">➕ SLOT</button><button onclick="buyTreadmill()">🏃 TREADMILL</button><div class="small">Equipped: <span id="equipped">0</span> | Capacity: <span id="capacity2">3</span></div><div class="small">Next slot: $<span id="slotCost">500</span></div><div class="small">Treadmill Lv <span id="treadLevel">0</span> — $<span id="treadCost">250</span></div><div class="bar"><i id="hatchBar"></i></div><div class="small" id="hatchText">No egg growing</div></div>
<div id="message" class="panel msg"></div><div class="panel help">A/D or ←/→ = move. W/S or ↑/↓ = move through the stacked worlds. <b>E</b> = steal/hatch. Mothers chase you after you steal. Get back to the blue safe zone!</div><div class="panel petList"><b>🐾 PLOT PETS</b><div id="pets"></div></div></div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const SPRITE='sprites.png';const sheet=new Image();sheet.src=SPRITE;
const worlds=[
{name:'Meadow',mother:'Cow',bg:'#76bd65',sky:'#b9edff',egg:'#f3df8a',hatch:8,pet:[['Bunny',1,75,0.8],['Cow',3,20,1.1],['Golden Bunny',9,5,0.9]]},
{name:'Forest',mother:'Wolf',bg:'#4b8d5b',sky:'#91d5d1',egg:'#9bd080',hatch:15,pet:[['Fox',5,65,1],['Wolf Pup',10,30,1.15],['Forest Spirit',28,5,1.35]]},
{name:'Swamp',mother:'Croc',bg:'#3f765d',sky:'#78b99b',egg:'#8acfb0',hatch:25,pet:[['Frog',14,60,0.75],['Croc Baby',28,34,1.25],['Swamp Monster',75,6,1.5]]},
{name:'Volcano',mother:'Dragon',bg:'#a44e40',sky:'#f6a16d',egg:'#ff9d4a',hatch:40,pet:[['Dragonling',40,70,1],['Lava Dragon',90,25,1.3],['Ancient Dragon',280,5,1.65]]},
{name:'Cosmos',mother:'Void Beast',bg:'#51479a',sky:'#887ed5',egg:'#d0b7ff',hatch:60,pet:[['Void Cat',100,65,0.9],['Void Wolf',210,30,1.25],['Cosmic Beast',750,5,1.8]]}
];
const VIEW_W=960,VIEW_H=540,plotH=155,safeH=75,worldH=360,worldGap=25,worldW=900,worldTop=plotH+safeH;const totalH=worldTop+worlds.length*(worldH+worldGap)+100;
const player={x:480,y:worldTop+worlds.length*(worldH+worldGap)+25,screenY:VIEW_H/2};let worldScroll=0;let keys={};let last=performance.now();
let game={cash:100,capacity:3,speedLevel:0,pets:[],equipped:[],egg:null,lastReset:Date.now()};try{game=Object.assign(game,JSON.parse(localStorage.getItem('stealAPet2D')||'{}'))}catch(e){}
let mothers=[],eggs=[],petsOnPlot=[];
function save(){localStorage.setItem('stealAPet2D',JSON.stringify(game))}function msg(t){const e=document.getElementById('message');e.textContent=t;e.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>e.style.display='none',2400)}
function slotCost(){return Math.floor(500*Math.pow(2.05,game.capacity-3))}function treadCost(){return Math.floor(250*Math.pow(2.15,game.speedLevel))}function worldY(i){return worldTop+i*(worldH+worldGap)}function worldAtY(y){let i=Math.floor((y-worldTop)/(worldH+worldGap));return Math.max(0,Math.min(worlds.length-1,i))}
function resetEggs(){eggs=[];worlds.forEach((w,i)=>{let wy=worldY(i);let count=Math.max(1,3-i/1.5|0);for(let j=0;j<count;j++)eggs.push({world:i,x:260+j*115,y:wy+190+(j%2)*45,taken:false})});mothers=worlds.map((w,i)=>({world:i,x:680,y:worldY(i)+190,homeX:680,homeY:worldY(i)+190,angry:false}));game.lastReset=Date.now();save();msg('🔄 Every egg has respawned!')}
resetEggs();
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function weightedPet(w){let r=Math.random()*100,s=0;for(const p of w.pet){s+=p[2];if(r<=s)return{name:p[0],power:p[1],size:p[3],world:w.name}}return{name:w.pet[0][0],power:w.pet[0][1],size:w.pet[0][3],world:w.name}}
function equipBest(){game.equipped=game.pets.map((p,i)=>({p,i})).sort((a,b)=>(b.p.power*b.p.size)-(a.p.power*a.p.size)).slice(0,Math.min(3,game.capacity)).map(x=>x.i);syncPlotPets();save();msg('⭐ Best pets equipped!')}
function buySlot(){let c=slotCost();if(game.cash<c)return msg('Not enough money!');game.cash-=c;game.capacity++;save();msg('➕ Pet capacity is now '+game.capacity)}
function buyTreadmill(){let c=treadCost();if(game.cash<c)return msg('Not enough money!');game.cash-=c;game.speedLevel++;save();msg('🏃 Treadmill upgraded to level '+game.speedLevel)}
function syncPlotPets(){petsOnPlot=game.equipped.map((idx,n)=>{let p=game.pets[idx];return{p,x:120+n*130+Math.random()*30,y:plotH-48-Math.random()*45,vx:(Math.random()<.5?-1:1)*(15+Math.random()*20),vy:0}})}syncPlotPets();
function drawSprite(kind,x,y,size=1,flip=false){if(!sheet.complete)return;let sx=0,sy=0,sw=32,sh=32;const map={player:[0,0],cow:[32,0],wolf:[64,0],croc:[96,0],dragon:[128,0],void:[160,0],bunny:[0,32],fox:[32,32],frog:[64,32],cat:[96,32],beast:[128,32]};[sx,sy]=map[kind]||map.player;ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);ctx.drawImage(sheet,sx,sy,sw,sh,-16*size,-16*size,32*size,32*size);ctx.restore()}
function petKind(name){let n=name.toLowerCase();if(n.includes('bunny'))return'bunny';if(n.includes('fox'))return'fox';if(n.includes('frog'))return'frog';if(n.includes('cat'))return'cat';if(n.includes('beast')||n.includes('monster'))return'beast';return n.includes('dragon')?'dragon':n.includes('wolf')?'wolf':'bunny'}
function render(){ctx.clearRect(0,0,W,H);let sx=W/VIEW_W,sy=H/VIEW_H,s=Math.min(sx,sy);ctx.save();ctx.scale(s,s);ctx.translate((W/s-VIEW_W)/2,0);
 // sky and stacked world camera
 ctx.fillStyle='#7bc9ef';ctx.fillRect(0,0,VIEW_W,VIEW_H);
 let target=player.y-player.screenY;worldScroll+=(target-worldScroll)*0.12;worldScroll=Math.max(0,Math.min(totalH-VIEW_H,worldScroll));ctx.save();ctx.translate(0,-worldScroll);
 // stacked worlds
 worlds.forEach((w,i)=>{let y=worldY(i);ctx.fillStyle=w.sky;ctx.fillRect(0,y,VIEW_W,worldH);ctx.fillStyle=w.bg;ctx.fillRect(0,y+90,VIEW_W,worldH-90);ctx.fillStyle='#fff';ctx.font='bold 26px monospace';ctx.fillText(w.name,30,y+40);ctx.font='bold 14px monospace';ctx.fillText('MAMA '+w.mother.toUpperCase(),30,y+64);ctx.fillStyle='#20232b';ctx.fillRect(0,y+worldH-35,VIEW_W,35); // mother
 let m=mothers[i];drawSprite(motherKind(w.mother),m.x,m.y,2.1,m.x>player.x); // eggs
 eggs.filter(e=>e.world===i&&!e.taken).forEach(e=>{ctx.fillStyle=w.egg;ctx.fillRect(e.x-10,e.y-14,20,28);ctx.fillStyle='#fff8';ctx.fillRect(e.x-5,e.y-10,5,8)});
 });
 // safe zone
 ctx.fillStyle='#2e87e8';ctx.fillRect(0,worldTop-safeH,VIEW_W,safeH);ctx.fillStyle='#fff';ctx.font='bold 16px monospace';ctx.fillText('SAFE ZONE',35,worldTop-30);ctx.fillText('MOTHERS CANNOT ENTER',620,worldTop-30);
 // plot at bottom
 ctx.fillStyle='#3e80d9';ctx.fillRect(0,worldTop+worlds.length*(worldH+worldGap),VIEW_W,plotH);ctx.fillStyle='#fff';ctx.font='bold 24px monospace';ctx.fillText('YOUR PET PLOT',30,worldTop+worlds.length*(worldH+worldGap)+35);
 let py=worldTop+worlds.length*(worldH+worldGap)+plotH/2;ctx.fillStyle='#f1c84c';ctx.fillRect(420,py-35,120,70);ctx.fillStyle='#5a4311';ctx.font='bold 13px monospace';ctx.fillText('EGG NEST',438,py+5);
 // treadmill
 ctx.fillStyle='#292c35';ctx.fillRect(40,py-35,190,55);ctx.fillStyle='#101116';ctx.fillRect(50,py-25,170,30);ctx.fillStyle='#ffe66d';ctx.font='bold 13px monospace';ctx.fillText('TREADMILL',76,py-7);
 // roaming pets
 petsOnPlot.forEach(o=>{o.x+=o.vx*0.016;if(o.x<20||o.x>930)o.vx*=-1;drawSprite(petKind(o.p.name),o.x,o.y,o.p.size)});
 // held egg over player
 if(game.egg){ctx.fillStyle=worlds[game.egg.world].egg;ctx.fillRect(player.x-9,player.y-37,18,24);ctx.fillStyle='#fff8';ctx.fillRect(player.x-4,player.y-34,4,7)}
 drawSprite('player',player.x,player.y,1.35,keys.a||keys.arrowleft);
 // mothers angry warning
 mothers.forEach(m=>{if(m.angry){ctx.fillStyle='#ff4d4d';ctx.font='bold 16px monospace';ctx.fillText('!',m.x-4,m.y-30)}});
 ctx.restore();ctx.restore();updateUI()}
function motherKind(n){n=n.toLowerCase();return n==='cow'?'cow':n==='wolf'?'wolf':n==='croc'?'croc':n==='dragon'?'dragon':'void'}
function onTreadmill(){let plotY=worldTop+worlds.length*(worldH+worldGap),py=plotY+plotH/2;return player.y>py-55&&player.y<py+30&&player.x>35&&player.x<235}
function safeZone(){return player.y>=worldTop-safeH-5&&player.y<=worldTop+8}
function interact(){if(game.egg)return msg('You are already carrying an egg! Get it home.');
 // nest
 let plotY=worldTop+worlds.length*(worldH+worldGap),nest={x:480,y:plotY+plotH/2};if(dist(player,nest)<80){if(game.egg)return;return msg('You need to steal an egg first!')}
 // egg
 let e=eggs.find(e=>!e.taken&&dist(player,e)<55);if(e){e.taken=true;game.egg={world:e.world};mothers[e.world].angry=true;save();msg('🥚 You stole a '+worlds[e.world].name+' egg! RUN!');return}
 // mother
 let m=mothers[worldAtY(player.y)];if(dist(player,m)<65&&!m.angry)msg('This mother is guarding her eggs!');
}
function deliverEgg(){if(!game.egg)return;let plotY=worldTop+worlds.length*(worldH+worldGap),nest={x:480,y:plotY+plotH/2};if(dist(player,nest)<85){let w=game.egg.world;game.hatching={world:w,ready:Date.now()+worlds[w].hatch*1000};game.egg=null;mothers[w].angry=false;save();msg('🥚 Egg is growing! Better eggs take longer.')}}
function updateUI(){cash.textContent=Math.floor(game.cash);eggState.textContent=game.egg?worlds[game.egg.world].name+' Egg':'No Egg';petCount.textContent=game.pets.length;capacity.textContent=game.capacity;capacity2.textContent=game.capacity;speed.textContent=(1+game.speedLevel*.35*(onTreadmill()?1:0)).toFixed(2);equipped.textContent=game.equipped.length;slotCost.textContent=slotCost();treadLevel.textContent=game.speedLevel;treadCost.textContent=treadCost();let income=game.equipped.reduce((a,i)=>{let p=game.pets[i];return a+(p?Math.round(p.power*p.size):0)},0);document.getElementById('income').textContent=income;let h=game.hatching;if(h){let total=worlds[h.world].hatch*1000,done=Math.min(1,1-(h.ready-Date.now())/total);document.getElementById('hatchBar').style.width=(done*100)+'%';document.getElementById('hatchText').textContent=Date.now()>=h.ready?'🥚 READY — walk to nest and press E':'Growing '+Math.max(0,Math.ceil((h.ready-Date.now())/1000))+'s'}else{document.getElementById('hatchBar').style.width='0%';document.getElementById('hatchText').textContent='No egg growing'}pets.innerHTML=game.pets.length?game.pets.map((p,i)=>`<div class="petRow"><span>${p.name} ${game.equipped.includes(i)?'⭐':''}</span><span>$${Math.round(p.power*p.size)}/s</span></div>`).join(''):'No pets yet.'}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e'){if(game.hatching&&Date.now()>=game.hatching.ready){let plotY=worldTop+worlds.length*(worldH+worldGap),nest={x:480,y:plotY+plotH/2};if(dist(player,nest)<90){if(game.pets.length>=game.capacity)msg('Pet storage is full! Buy a slot.');else{let p=weightedPet(worlds[game.hatching.world]);game.pets.push(p);game.hatching=null;syncPlotPets();save();msg('🎉 You hatched '+p.name+'!')}}}else if(game.egg)deliverEgg();else interact()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function tick(now){let dt=Math.min(.035,(now-last)/1000);last=now;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);let len=Math.hypot(dx,dy)||1;let base=180;let boost=onTreadmill()?1+game.speedLevel*.35:1;player.x+=dx/len*base*boost*dt;player.y+=dy/len*base*boost*dt;player.x=Math.max(25,Math.min(VIEW_W-25,player.x));player.y=Math.max(worldTop-safeH-5,Math.min(totalH-25,player.y));
 // angry mothers chase horizontally and vertically until safe zone
 mothers.forEach(m=>{if(!m.angry)return; if(safeZone()){m.angry=false;return}let dx=player.x-m.x,dy=player.y-m.y,d=Math.hypot(dx,dy)||1;m.x+=dx/d*72*dt;m.y+=dy/d*72*dt;if(d<32){player.x-=dx/d*80*dt;player.y-=dy/d*80*dt;msg('😱 The mother caught you! Keep running!')}});
 // passive income
 let income=game.equipped.reduce((a,i)=>{let p=game.pets[i];return a+(p?Math.round(p.power*p.size):0)},0);game.cash+=income*dt;
 if(Date.now()-game.lastReset>=300000)resetEggs();render();requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
