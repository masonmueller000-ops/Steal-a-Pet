<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steal a Pet</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#101522;color:#fff;font-family:Arial}canvas{display:block}.ui{position:fixed;z-index:2;background:#111827eF;border:1px solid #39455d;border-radius:12px;padding:10px;box-shadow:0 6px 25px #0006}.stats{top:10px;left:10px;display:flex;gap:8px}.controls{top:10px;right:10px;width:250px}.inventory{right:10px;bottom:10px;width:280px;max-height:40vh;overflow:auto}.help{left:10px;bottom:10px;max-width:330px;font-size:13px}.msg{top:12px;left:50%;transform:translateX(-50%);display:none}.pet{display:flex;justify-content:space-between;border-bottom:1px solid #293244;padding:6px}button{background:#527cff;color:#fff;border:0;border-radius:8px;padding:8px;margin:2px;font-weight:bold;cursor:pointer}h3{margin:0 0 7px}</style></head><body><canvas id="c"></canvas><div class="ui stats">💰 $<b id="cash">100</b>　🥚 <b id="eggs">0</b>　🐾 <b id="pc">0</b>/<b id="cap">3</b>　⚡ <b id="spd">1</b></div><div class="ui controls"><h3>🐾 STEAL A PET</h3><button onclick="equipBest()">⭐ Equip Best</button><button onclick="slot()">➕ Pet Slot</button><button onclick="tread()">🏃 Buy Treadmill</button><div>Equipped: <b id="eq">0</b></div><div>Slot: $<b id="slotc">500</b></div><div>Treadmill Lv <b id="tl">0</b>: $<b id="tc">250</b></div></div><div id="msg" class="ui msg"></div><div class="ui inventory"><h3>Pet Collection</h3><div id="pets">No pets yet.</div></div><div class="ui help">WASD / Arrow Keys to move. Press <b>E</b> near an egg or mother to steal. Bring eggs to your blue property nest to hatch. Walk over the treadmill area to earn cash.</div><script>
const C=document.getElementById('c'),x=C.getContext('2d');let W,H;function size(){W=innerWidth;H=innerHeight;C.width=W;C.height=H}addEventListener('resize',size);size();
const worlds=[['Meadow','Mama Moo','#74b967','#ead278',8,[['Bunny',1,70],['Cow',3,25],['Golden Bunny',8,5]]],['Forest','Mama Wolf','#4c8f5d','#a7d47d',15,[['Fox',5,65],['Wolf Pup',9,30],['Forest Spirit',25,5]]],['Swamp','Mama Croc','#3e735c','#6bd090',25,[['Frog',15,60],['Croc Baby',25,34],['Swamp Monster',70,6]]],['Volcano','Mama Dragon','#9b493e','#ff9d4c',40,[['Dragonling',40,70],['Lava Dragon',80,25],['Ancient Dragon',250,5]]],['Cosmos','Mama Void Beast','#554e9d','#b59cff',60,[['Void Cat',100,65],['Void Wolf',200,30],['Cosmic Beast',700,5]]]];
const WW=520,WH=390,G=80,START=270,MAP=START+worlds.length*(WW+G);let p={x:120,y:WH/2},keys={},cam=0;let s=JSON.parse(localStorage.getItem('sap')||'null')||{cash:100,eggs:0,cap:3,speed:0,pets:[],eq:[],eggWorld:0, hatch:null,lastReset:Date.now()};
function save(){localStorage.setItem('sap',JSON.stringify(s))}function wx(i){return START+i*(WW+G)}function say(t){let m=document.getElementById('msg');m.textContent=t;m.style.display='block';clearTimeout(window.mt);window.mt=setTimeout(()=>m.style.display='none',2200)}function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function costSlot(){return Math.floor(500*2.05**(s.cap-3))}function costTread(){return Math.floor(250*2.15**s.speed)}
let eggs=[];function reset(){eggs=[];worlds.forEach((w,i)=>{let n=i===4?1:i===3?2:3;for(let j=0;j<n;j++)eggs.push({w:i,x:wx(i)+145+j*65,y:WH/2+30+(j%2)*60,t:0})});s.lastReset=Date.now();save()}reset();
function pet(w){let r=Math.random()*100,a=0;for(let q of worlds[w][5]){a+=q[2];if(r<=a)return{name:q[0],power:q[1]}}}
function interact(){let wi=Math.max(0,Math.min(4,Math.floor((p.x-START)/(WW+G))));let w=worlds[wi];if(d(p,{x:130,y:WH/2})<70){if(s.hatch){if(Date.now()<s.hatch.ready){say('🥚 Growing: '+Math.ceil((s.hatch.ready-Date.now())/1000)+'s');return}if(s.pets.length>=s.cap){say('Pet storage full! Buy a slot.');return}let q=pet(s.hatch.w);s.pets.push(q);s.hatch=null;save();say('🎉 Hatched '+q.name+'! Power '+q.power);return}if(s.eggs){s.eggs--;s.hatch={w:s.eggWorld,ready:Date.now()+worlds[s.eggWorld][4]*1000};save();say('🥚 '+worlds[s.eggWorld][0]+' egg is growing!')}else say('Bring an egg here.');return}for(let e of eggs){if(!e.t&&d(p,e)<55){e.t=1;s.eggs++;s.eggWorld=e.w;save();say('🥚 Stole a '+worlds[e.w][0]+' egg!');return}}let mx=wx(wi)+80;if(d(p,{x:mx,y:WH/2-5})<70){let e=eggs.find(e=>!e.t&&e.w===wi);if(e){e.t=1;s.eggs++;s.eggWorld=wi;save();say('🏃 Stole an egg from '+w[1]+'!')}else say('No eggs left here.')}}
function slot(){let c=costSlot();if(s.cash<c)return say('Not enough cash!');s.cash-=c;s.cap++;save();say('Pet slot purchased!')}function tread(){let c=costTread();if(s.cash<c)return say('Not enough cash!');s.cash-=c;s.speed++;save();say('Treadmill upgraded!')}function equipBest(){s.eq=s.pets.map((q,i)=>({q,i})).sort((a,b)=>b.q.power-a.q.power).slice(0,Math.min(3,s.cap)).map(z=>z.i);save();say('⭐ Equipped best pets!')}
function ui(){cash.textContent=Math.floor(s.cash);eggsEl.textContent=s.eggs;pc.textContent=s.pets.length;cap.textContent=s.cap;spd.textContent=(1+s.speed*.35).toFixed(2);eq.textContent=s.eq.length;slotc.textContent=costSlot();tl.textContent=s.speed;tc.textContent=costTread();pets.innerHTML=s.pets.length?s.pets.map((q,i)=>'<div class="pet"><span>'+q.name+'</span><b>⚡'+q.power+(s.eq.includes(i)?' ⭐':'')+'</b></div>').join(''):'No pets yet.'}const eggsEl=document.getElementById('eggs');
function draw(){x.clearRect(0,0,W,H);cam=Math.max(0,Math.min(MAP-W,p.x-W/2));x.save();x.translate(-cam,40);x.fillStyle='#292d38';x.fillRect(0,WH/2-38,MAP,76);x.fillStyle='#3b78d0';x.fillRect(20,20,210,WH-40);x.fillStyle='#fff';x.font='bold 28px Arial';x.fillText('YOUR PROPERTY',40,55);x.fillStyle='#f4c542';x.beginPath();x.arc(125,WH/2,45,0,7);x.fill();x.fillStyle='#543';x.font='bold 14px Arial';x.fillText('NEST',105,WH/2+5);for(let i=0;i<worlds.length;i++){let w=worlds[i],xx=wx(i);x.fillStyle=w[2];x.fillRect(xx,0,WW,WH);x.fillStyle='#fff';x.font='bold 27px Arial';x.fillText(w[0],xx+20,38);x.font='bold 14px Arial';x.fillText(w[1],xx+20,60);x.fillStyle='#29262d';x.beginPath();x.arc(xx+80,WH/2-5,31,0,7);x.fill();x.fillStyle='#fff';x.font='bold 11px Arial';x.fillText('MOTHER',xx+51,WH/2);eggs.filter(e=>e.w===i&&!e.t).forEach(e=>{x.fillStyle=w[3];x.beginPath();x.ellipse(e.x,e.y,17,22,0,0,7);x.fill()});}x.fillStyle='#30343d';for(let i=0;i<3;i++){x.fillRect(260+i*70,55,55,28);x.fillStyle='#111';x.fillRect(265+i*70,62,45,14);x.fillStyle='#30343d'}x.fillStyle='#ffd98d';x.beginPath();x.arc(p.x,p.y,16,0,7);x.fill();x.fillStyle='#4f7cff';x.fillRect(p.x-12,p.y+8,24,12);x.restore();ui()}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);let last=performance.now();function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),l=Math.hypot(dx,dy)||1;p.x=Math.max(25,Math.min(MAP-25,p.x+dx/l*190*(1+s.speed*.35)*dt));p.y=Math.max(25,Math.min(WH-25,p.y+dy/l*190*(1+s.speed*.35)*dt));if(p.x>260&&p.x<490&&p.y<105)s.cash+=dt*3*(1+s.speed);if(Date.now()-s.lastReset>=300000)reset();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
