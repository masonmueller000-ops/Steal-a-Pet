<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steal a Pet</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0b0d14;font-family:monospace}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#hud,#hint,#area{position:fixed;z-index:5;color:#fff;background:#171b28;border:3px solid #090b11;box-shadow:4px 4px #0008;font-weight:900;text-shadow:2px 2px #000}#hud{left:14px;top:14px;padding:9px 12px;line-height:1.5}#hint{right:14px;bottom:14px;padding:7px 9px;font-size:11px}#area{left:50%;top:14px;transform:translateX(-50%);padding:8px 22px;font-size:18px;opacity:0;transition:opacity .3s}#area.show{opacity:1}</style></head><body><canvas id="game" tabindex="0"></canvas><div id="hud">💰 $<span id="cash">100</span><br>🐾 Pets: <span id="pets">0</span><br>🏁 Speed: <span id="speed">1</span><br>🌙 <span id="night">05:00</span></div><div id="area"></div><div id="hint">WASD / Arrows • E: steal / hatch • Click plot: plant • Click treadmill sign: upgrade</div><script>
'use strict';
const C=document.getElementById('game'),G=C.getContext('2d');G.imageSmoothingEnabled=false;const VW=480,VH=320;let cam=0,last=performance.now(),lastArea='';
function fit(){C.width=innerWidth*devicePixelRatio;C.height=innerHeight*devicePixelRatio;const s=Math.min(innerWidth/VW,innerHeight/VH);G.setTransform(devicePixelRatio*s,0,0,devicePixelRatio*s,(innerWidth-devicePixelRatio*VW*s)/2,(innerHeight-devicePixelRatio*VH*s)/2);G.imageSmoothingEnabled=false}addEventListener('resize',fit);fit();
const worlds=[
{name:'MEADOW',desc:'Green Pastures',bg:'#70bd5d',rec:500,mother:'COW',ms:45,len:230,grow:18,eggs:['Grass','Sun','Clover','Honey','Rainbow','Golden','Star','Emerald'],colors:['#e8d49d','#f5cf52','#8bdc72','#e8ad49','#7bd8e8','#ffd34f','#f3a8df','#55d97a']},
{name:'FOREST',desc:'Whispering Woods',bg:'#397b43',rec:900,mother:'WOLF',ms:70,len:290,grow:25,eggs:['Pine','Moss','Acorn','Moon','Crystal','Ancient','Royal','Aurora'],colors:['#9bd7a0','#70ad68','#b8894c','#b9d8ee','#7fc8e8','#c7a6df','#f0b7e7','#82e4d0']},
{name:'SWAMP',desc:'Murky Marsh',bg:'#2b6258',rec:1600,mother:'CROCODILE',ms:100,len:360,grow:34,eggs:['Mire','Reed','Bog','Frog','Toxic','Pearl','Phantom','Jade'],colors:['#91d29a','#73b66e','#9c8053','#7fcb77','#b3e46b','#e6e8ef','#c1a2dd','#45d3a5']},
{name:'DESERT',desc:'Sunken Sands',bg:'#d29a53',rec:2500,mother:'DRAGON',ms:135,len:430,grow:45,eggs:['Sand','Cactus','Dune','Scarab','Ruby','Solar','Ancient','Phoenix'],colors:['#ead08b','#76b85b','#e7ae68','#49b5b2','#e85a4f','#ffdc57','#c6a0e0','#f07d47']},
{name:'COSMOS',desc:'Outer Void',bg:'#29234c',rec:4000,mother:'VOID MONSTER',ms:180,len:520,grow:60,eggs:['Dust','Comet','Nebula','Moon','Galaxy','Void','Stellar','Cosmic'],colors:['#aaa0c9','#d7e7ff','#c18be8','#d6d8e8','#7da9ff','#8d68cf','#f0c9ff','#6cf0e3']}];
const base=225,plotH=170,safeH=55,starts=[];let yy=base;worlds.forEach(w=>{starts.push(yy);yy+=w.len});const totalH=yy;
const rarities=[{name:'Common',w:55,m:1},{name:'Uncommon',w:25,m:1.4},{name:'Rare',w:11,m:2.2},{name:'Epic',w:5,m:3.5},{name:'Legendary',w:2.5,m:6},{name:'Mythic',w:1,m:10},{name:'Cosmic',w:.4,m:18},{name:'Secret',w:.1,m:40}];
const pets=[{n:'Bunny',inc:8,c:'#efd6df',kind:0},{n:'Pup',inc:14,c:'#b97943',kind:1},{n:'Fox',inc:22,c:'#e86c2f',kind:2},{n:'Baby Dragon',inc:40,c:'#60c96b',kind:3},{n:'Cosmo Cat',inc:80,c:'#aa76e8',kind:4}];
let game={cash:100,speed:1,upgrade:1,tread:0,lastReset:Date.now(),holding:null,plotEggs:[],worldEggs:[],owned:[]},p={x:240,y:195,vx:0,vy:0,walk:0,face:1};const keys={};
function newWorldEgg(i){let w=worlds[i],out=[];for(let k=0;k<8;k++)out.push({world:i,type:k,rarity:rarities[k],size:.65+Math.random()*1.1,x:20+Math.random()*440,y:starts[i]+65+Math.random()*(w.len-95),ready:Date.now()+w.grow*1000*(.7+Math.random()*.8),picked:false});return out}worlds.forEach((_,i)=>game.worldEggs.push(...newWorldEgg(i)));
function text(t,x,y,n=8,col='#fff',a='center'){G.font='bold '+n+'px monospace';G.textAlign=a;G.fillStyle=col;G.strokeStyle='#11131a';G.lineWidth=2;G.strokeText(t,x,y);G.fillText(t,x,y)}function popup(t){area.textContent=t;area.classList.add('show');clearTimeout(popup.t);popup.t=setTimeout(()=>area.classList.remove('show'),1300)}
// Real pixel-art renderer: all sprites are painted on a tiny integer grid, then enlarged with nearest-neighbor.
function px(grid,x,y,s,pal){G.save();G.translate(Math.round(x),Math.round(y));for(let r=0;r<grid.length;r++)for(let c=0;c<grid[r].length;c++){let v=grid[r][c];if(v!=='.'&&pal[v]){G.fillStyle=pal[v];G.fillRect(c*s,r*s,s,s)}}G.restore()}
const PF=[['...KK...','..KHHK..','.KSSSSK.','.KSSSSK.','KSSSSSSK','.KSSSSK.','..KSSK..','.KK..KK.','..K..K..','..K..K..'],['...KK...','..KHHK..','.KSSSSK.','.KSSSSK.','KSSSSSSK','.KSSSSK.','..KSSK..','..KKSS..','...K.K..','..K...K.'],['...KK...','..KHHK..','.KSSSSK.','.KSSSSK.','KSSSSSSK','.KSSSSK.','..KSSK..','..SSKK..','..K...K.','.K.....K.']];
function player(){let f=Math.floor(p.walk)%3;px(PF[f],p.x-8,p.y-19,2,{K:'#172033',H:'#efb68c',S:'#e4514f'});if(game.holding)egg(p.x+17,p.y-5,worlds[game.holding.world].colors[game.holding.type],game.holding.size*.5)}
function egg(x,y,col,s=1){let q=Math.max(1,Math.round(s*2));G.fillStyle=col;G.strokeStyle='#11131a';G.lineWidth=1;G.beginPath();G.moveTo(Math.round(x),Math.round(y-8*q));G.lineTo(Math.round(x+4*q),Math.round(y-4*q));G.lineTo(Math.round(x+4*q),Math.round(y+4*q));G.lineTo(Math.round(x+2*q),Math.round(y+8*q));G.lineTo(Math.round(x-3*q),Math.round(y+8*q));G.lineTo(Math.round(x-5*q),Math.round(y+2*q));G.lineTo(Math.round(x-4*q),Math.round(y-4*q));G.closePath();G.fill();G.stroke();G.fillStyle='#fff';G.fillRect(Math.round(x-2*q),Math.round(y-4*q),q,q)}
function petSprite(d,x,y,t,s=.8){let q=Math.round(s*2),b=Math.round(Math.sin(t)),w=Math.round(Math.sin(t*1.8)*2);G.save();G.translate(Math.round(x),Math.round(y+b));G.scale(q,q);G.fillStyle=d.c;G.strokeStyle='#11131a';G.lineWidth=1;if(d.kind===0){G.fillRect(-10,-2,20,9);G.fillRect(-7,-11,14,10);G.fillRect(-10,-18,5,10);G.fillRect(5,-18,5,10)}else if(d.kind===1){G.fillRect(-12,-2,23,10);G.fillRect(7,-11,9,10);G.fillRect(-10,-11,6,6);G.fillRect(-18,0,7,4)}else if(d.kind===2){G.fillRect(-12,-2,22,11);G.fillRect(5,-11,11,10);G.fillRect(9,-18,5,8);G.fillRect(-16,-7,7,6)}else if(d.kind===3){G.fillRect(-12,-2,24,12);G.fillRect(7,-12,10,10);G.fillRect(-7,-10,7,8);G.fillStyle='#3b9849';G.fillRect(-19,-12-w,9,5);G.fillRect(10,-12+w,9,5)}else{G.fillRect(-11,-4,22,16);G.fillRect(-8,-15,16,11);G.fillRect(-11,-20,6,8);G.fillRect(5,-20,6,8)}G.strokeRect(-12,-3,24,14);G.fillStyle='#fff';G.fillRect(-6,-9,3,3);G.fillRect(4,-9,3,3);G.fillStyle='#111';G.fillRect(-5,-9,2,2);G.fillRect(5,-9,2,2);G.restore()}
function bushes(i,y){let seed=i*977+31;for(let k=0;k<14;k++){seed=(seed*9301+49297)%233280;let x=15+(seed/233280)*450;seed=(seed*9301+49297)%233280;let yy=y+70+(seed/233280)*(worlds[i].len-95);let col=i===3?'#6f8137':i===2?'#1c5148':i===1?'#245d35':'#3d9144';G.fillStyle=col;let X=Math.round(x),Y=Math.round(yy);G.fillRect(X,Y,7,5);G.fillRect(X-4,Y+4,15,7);G.fillRect(X+1,Y-3,6,5)}}
function world(i){let w=worlds[i],y=starts[i];G.fillStyle=w.bg;G.fillRect(0,y,480,w.len);bushes(i,y);if(i===0){for(let x=55;x<460;x+=105){G.fillStyle='#b7a56a';G.fillRect(x,y+195,4,12);G.fillStyle='#3f9144';G.fillRect(x-5,y+190,14,6)}}if(i===1){for(let x=40;x<460;x+=95){G.fillStyle='#255b34';G.fillRect(x,y+130,8,70);G.fillRect(x-10,y+125,28,8)}}if(i===2){for(let x=65;x<460;x+=120){G.fillStyle='#8fcf87';G.fillRect(x,y+230,20,5);G.fillStyle='#2b4c42';G.fillRect(x+7,y+220,5,15)}}if(i===3){G.fillStyle='#e6b86a';G.beginPath();G.moveTo(275,y+275);G.lineTo(350,y+70);G.lineTo(425,y+275);G.closePath();G.fill();G.strokeStyle='#80542c';G.stroke();G.fillStyle='#7b4d25';G.fillRect(345,y+225,12,50)}if(i===4){for(let k=0;k<70;k++){G.fillStyle='#fff';G.fillRect((k*73)%480,y+60+(k*37)%(w.len-75),1,1)}}let m=mothers[i];mother(i,m);game.worldEggs.filter(e=>e.world===i&&!e.picked).forEach(e=>egg(e.x,e.y,w.colors[e.type],e.size))}
function mother(i,m){let c=['#bd7d4d','#68717e','#47766b','#7f4e35','#8554ba'][i];G.fillStyle=c;G.strokeStyle='#11131a';G.fillRect(m.x-16,m.y-8,32,16);G.strokeRect(m.x-16,m.y-8,32,16);G.fillRect(m.x+10,m.y-18,12,12);G.strokeRect(m.x+10,m.y-18,12,12);text(m.angry?'!':'Z Z',m.x+30,m.y-20,8,m.angry?'#ff5555':'#fff')}
function plot(){G.fillStyle='#70c466';G.fillRect(0,0,480,plotH);G.strokeStyle='#30231c';G.lineWidth=5;G.strokeRect(9,9,462,plotH-18);text('YOUR PET HABITAT',18,25,11,'#fff','left');let t=performance.now()/150;game.owned.forEach((d,i)=>{if(d.x==null){d.x=35+Math.random()*390;d.y=55+Math.random()*100;d.tx=d.x;d.ty=d.y}if(Math.random()<.015){d.tx=35+Math.random()*390;d.ty=55+Math.random()*100}let dx=d.tx-d.x,dy=d.ty-d.y,l=Math.hypot(dx,dy)||1;d.x+=dx/l*.35;d.y+=dy/l*.35;petSprite(d,d.x,d.y,t+i*2,.8)});game.plotEggs.filter(e=>!e.hatched).forEach(e=>{let g=Math.min(1,(Date.now()-e.planted)/e.duration);egg(e.x,e.y,worlds[e.world].colors[e.type],e.size*(.7+.3*g));if(e.ready<=Date.now())text('READY!',e.x,e.y-12,7,'#fff')});treadmill()}
function treadmill(){let x=285,y=45;G.fillStyle='#242936';G.fillRect(x,y,130,38);G.strokeStyle='#10131b';G.strokeRect(x,y,130,38);G.fillStyle='#0d1118';G.fillRect(x+7,y+22,116,10);for(let i=0;i<8;i++){G.fillStyle='#9da7b5';G.fillRect(x+10+i*15-(performance.now()/80%15),y+25,9,2)}G.strokeStyle='#11131a';G.lineWidth=4;G.beginPath();G.moveTo(x+112,y+23);G.lineTo(x+112,y-10);G.lineTo(x+75,y-10);G.stroke();G.fillStyle='#202638';G.fillRect(x-3,y+42,74,33);G.strokeRect(x-3,y+42,74,33);text('🏁 '+game.speed,x+8,y+54,8,'#ffe66b','left');text('LV '+game.upgrade+' $'+game.upgrade*500,x+8,y+67,6,'#9cff91','left')}
const mothers=worlds.map((w,i)=>({world:i,x:350,y:starts[i]+w.len*.55,homeX:350,homeY:starts[i]+w.len*.55,angry:false}));
function safe(){return p.y>=plotH&&p.y<base}function onTread(){return p.x>280&&p.x<420&&p.y<95}
function interact(){if(game.holding)return;for(const e of game.worldEggs){if(!e.picked&&Math.hypot(p.x-e.x,p.y-e.y)<18){e.picked=true;game.holding={world:e.world,type:e.type,size:e.size,rarity:e.rarity};mothers[e.world].angry=true;popup('🥚 '+e.rarity.name+' EGG STOLEN!');return}}for(const e of game.plotEggs){if(!e.hatched&&e.ready<=Date.now()&&Math.hypot(p.x-e.x,p.y-e.y)<20){let d=pets[Math.floor(Math.random()*pets.length)];game.owned.push({...d,x:e.x,y:e.y,tx:e.x,ty:e.y});e.hatched=true;popup('🎉 '+d.n+' HATCHED!');return}}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','e'].includes(k))e.preventDefault();keys[k]=true;if(k==='e')interact()},{passive:false});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});C.addEventListener('pointerdown',e=>{C.focus();let r=C.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*VW,y=(e.clientY-r.top)/r.height*VH+cam;if(x>275&&x<425&&y>80&&y<145){let cost=game.upgrade*500;if(game.cash>=cost){game.cash-=cost;game.upgrade++;popup('TREADMILL LEVEL '+game.upgrade+'!')}return}if(game.holding&&x>18&&x<462&&y<plotH-8){let q=game.holding,dur=worlds[q.world].grow*1000*(.75+q.rarity.m*.35);game.plotEggs.push({world:q.world,type:q.type,size:q.size,rarity:q.rarity,planted:Date.now(),duration:dur,ready:Date.now()+dur,hatched:false,x,y});game.holding=null;popup('🥚 Egg planted!')}});
function update(dt){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),tr=onTread();if(dx||dy){let l=Math.hypot(dx,dy),slow=game.holding&&game.holding.size>1.35?1/(1+(game.holding.size-1.35)*.9):1,spd=(82+game.speed*5)*slow;p.vx=dx/l*spd;p.vy=dy/l*spd;p.walk+=dt*(tr?10:7);if(dx)p.face=dx>0?1:-1}else{p.vx=p.vy=0;if(tr)p.walk+=dt*8}p.x=Math.max(15,Math.min(465,p.x+p.vx*dt));p.y=Math.max(0,Math.min(totalH-15,p.y+p.vy*dt));if(tr){game.tread+=dt;if(game.tread>=10){game.speed++;game.tread-=10}}else game.tread=0;for(const m of mothers){if(m.angry&&!safe()){let dx=p.x-m.x,dy=p.y-m.y,l=Math.hypot(dx,dy)||1;m.x+=dx/l*worlds[m.world].ms*dt;m.y+=dy/l*worlds[m.world].ms*dt;if(l<18&&game.holding){let q=game.holding;game.plotEggs.push({world:q.world,type:q.type,size:q.size,rarity:q.rarity,planted:Date.now(),duration:worlds[q.world].grow*1000,ready:Date.now()+worlds[q.world].grow*1000,hatched:false,x:p.x,y:p.y});game.holding=null;m.angry=false;popup('💥 CAUGHT! EGG DROPPED!')}}if(safe())m.angry=false}game.cash+=game.owned.reduce((s,d)=>s+d.inc,0)*dt;if(Date.now()-game.lastReset>=300000){game.lastReset=Date.now();game.worldEggs.push(...worlds.flatMap((_,i)=>newWorldEgg(i)));popup('🌙 NIGHT — NEW WORLD EGGS!')}}
function render(){fit();cam+=(p.y-VH*.55-cam)*.12;cam=Math.max(0,Math.min(totalH-VH,cam));G.save();G.translate(0,-Math.round(cam));plot();G.fillStyle='#74c967';G.fillRect(0,plotH,480,safeH);for(let i=0;i<worlds.length;i++)world(i);if(game.holding)egg(p.x+12,p.y-5,worlds[game.holding.world].colors[game.holding.type],game.holding.size*.5);player();G.restore();document.getElementById('cash').textContent=Math.floor(game.cash);document.getElementById('pets').textContent=game.owned.length;document.getElementById('speed').textContent=game.speed;let left=Math.max(0,300-(Date.now()-game.lastReset)/1000);document.getElementById('night').textContent=Math.floor(left/60)+':'+String(Math.ceil(left%60)).padStart(2,'0');let a=p.y<plotH?'YOUR PLOT':safe()?'SAFE AREA':(()=>{for(let i=worlds.length-1;i>=0;i--)if(p.y>=starts[i])return worlds[i].name;return 'MEADOW'})();if(a!==lastArea){let wasWorld=lastArea&&worlds.some(w=>w.name===lastArea);let isWorld=worlds.some(w=>w.name===a);lastArea=a;if(isWorld&&!wasWorld)popup(a)}}function loop(n){let dt=Math.min(.033,(n-last)/1000);last=n;try{update(dt);render()}catch(e){console.error(e)}requestAnimationFrame(loop)}C.focus();requestAnimationFrame(loop);
</script></body></html>
