<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steal a Pet</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#111827;font-family:monospace}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#hud{position:fixed;left:18px;top:18px;z-index:5;color:#fff;font-weight:900;text-shadow:2px 2px #111;background:#171923d9;border:2px solid #ffffff35;border-radius:12px;padding:10px 14px;line-height:1.5}#area{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:6;color:#fff;background:#171923e8;border:2px solid #fff5;border-radius:14px;padding:9px 24px;font-size:18px;opacity:0;transition:opacity .35s;text-align:center}#hint{position:fixed;right:18px;bottom:18px;color:#fff;background:#171923d9;border:2px solid #fff3;border-radius:12px;padding:9px 12px;font-size:12px}.pill{display:inline-block;margin-top:4px;padding:2px 7px;border-radius:8px;background:#26344f}</style></head><body><canvas id="game"></canvas><div id="hud">💰 $<span id="cash">100</span><br>🐾 <span id="pets">0/3</span><br><span class="pill" id="speed">⚡ Speed 1.00x</span><br>🌙 <span id="night">05:00</span></div><div id="area"></div><div id="hint">WASD / Arrow Keys to move • E to steal/pick up • Click your fenced plot to plant an egg</div><img id="sheet" src="sprites.svg" hidden><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),sheet=document.getElementById('sheet');let dpr=1,VW=960,VH=600;function resize(){dpr=devicePixelRatio||1;c.width=innerWidth*dpr;c.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const worlds=[{name:'MEADOW',sky:'#9bd8ff',bg:'#72c866',mother:'cow',speed:75,hatch:35,egg:'#ffe3a3'},{name:'FOREST',sky:'#7dc5d6',bg:'#3d914f',mother:'wolf',speed:100,hatch:45,egg:'#b5e8ff'},{name:'SWAMP',sky:'#5b9c9b',bg:'#2d6762',mother:'croc',speed:125,hatch:55,egg:'#9de6a1'},{name:'DESERT',sky:'#f5c977',bg:'#d39b55',mother:'dragon',speed:155,hatch:70,egg:'#ffb27d'},{name:'COSMOS',sky:'#171735',bg:'#29204e',mother:'monster',speed:190,hatch:90,egg:'#d8b4ff'}];
const pets=[['Bunny',8],['Dog',14],['Fox',22],['Dragon',40],['Cosmo Cat',80]];let game={cash:100,pets:[],eggs:[],holding:null,lastReset:Date.now(),speedLevel:0};let player={x:480,y:0,vx:0,vy:0,anim:0};const plotH=250,safeH=110,worldH=500,plotY=0,safeY=plotH,worldBase=safeY+safeH,totalH=worldBase+worlds.length*worldH;player.y=plotY+plotH+safeH/2;
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);let cam=0,areaLast='';
const mothers=worlds.map((w,i)=>({world:i,x:700,y:worldBase+i*worldH+worldH*.55,homeX:700,homeY:worldBase+i*worldH+worldH*.55,sleep:true,angry:false,returning:false}));
function petSprite(i,x,y,s=1,frame=0){let sx=192+(i%5)*48,sy=48;ctx.drawImage(sheet,sx,sy,48,48,x-24*s,y-24*s,48*s,48*s)}
function playerSprite(x,y,s=1,frame=0,holding=false){let sx=(frame%4)*48;ctx.drawImage(sheet,sx,0,48,48,x-24*s,y-24*s,48*s,48*s);if(holding){ctx.fillStyle='#fff';ctx.strokeStyle='#171923';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x+19*s,y-5*s,9*s,13*s,0,0,Math.PI*2);ctx.fill();ctx.stroke()}}
function eggSprite(w,x,y,s=1){let sx=192+(w%5)*48,sy=144;ctx.drawImage(sheet,sx,sy,48,48,x-24*s,y-24*s,48*s,48*s)}
function motherSprite(w,x,y,s=1,frame=0){let sx=192+(w%5)*48,sy=48; if(w===0)sx=192; if(w===1)sx=240;if(w===2)sx=0; if(w===3)sx=48;if(w===4)sx=96;ctx.drawImage(sheet,sx,sy,48,48,x-30*s,y-30*s,60*s,60*s)}
function text(t,x,y,size=12,fill='#fff',align='center'){ctx.font='900 '+size+'px monospace';ctx.textAlign=align;ctx.fillStyle=fill;ctx.strokeStyle='#171923';ctx.lineWidth=4;ctx.strokeText(t,x,y);ctx.fillText(t,x,y)}
let floaters=[];function float(t,x,y,col='#ffe66d'){floaters.push({t,x,y,at:performance.now(),col})}function drawFloaters(){let n=performance.now();floaters=floaters.filter(f=>n-f.at<950);for(const f of floaters){let q=(n-f.at)/950;ctx.globalAlpha=1-q;text(f.t,f.x,f.y-q*45,14,f.col);ctx.globalAlpha=1}}
function drawPlot(){ctx.fillStyle='#6fd363';ctx.fillRect(0,plotY,VW,plotH);for(let x=0;x<VW;x+=32)for(let y=0;y<plotH;y+=32){ctx.fillStyle=((x+y)/32%2?'#73d969':'#7ce071');ctx.fillRect(x,y,25,25)}ctx.strokeStyle='#3b241b';ctx.lineWidth=10;ctx.strokeRect(18,16,VW-36,plotH-32);ctx.strokeStyle='#d48a45';ctx.lineWidth=3;ctx.strokeRect(18,16,VW-36,plotH-32);for(let x=28;x<VW-20;x+=52){ctx.fillStyle='#5a3422';ctx.fillRect(x,8,7,28);ctx.fillRect(x,plotH-36,7,28)}text('YOUR PET HABITAT',35,48,22,'#fff','left');text('CLICK INSIDE TO PLANT EGGS',35,68,10,'#fff','left');drawTreadmill();game.pets.forEach((p,i)=>{let x=110+(i*165)%730,y=125+((i*73)%85);petSprite(i,x,y,1,Math.floor(performance.now()/220)%2);text(p[0],x,y-34,10);text('+$'+p[1]+'/s',x,y+38,9,'#ffe66d')})}
function drawTreadmill(){let x=650,y=85,w=240;ctx.fillStyle='#252b38';ctx.strokeStyle='#0d111a';ctx.lineWidth=5;ctx.beginPath();ctx.roundRect(x,y,w,70,10);ctx.fill();ctx.stroke();ctx.fillStyle='#11151d';ctx.fillRect(x+15,y+34,w-30,23);let off=(performance.now()/5)%32;ctx.fillStyle='#9aa5b6';for(let i=-1;i<10;i++)ctx.fillRect(x+18+i*32-off,y+38,19,4);ctx.strokeStyle='#11151d';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x+w-35,y+38);ctx.lineTo(x+w-35,y-12);ctx.lineTo(x+w-88,y-12);ctx.stroke();text('TREADMILL',x+w/2,y+24,13,'#ffe66d')}
function drawWorld(i,w){let y=worldBase+i*worldH;ctx.fillStyle=w.sky;ctx.fillRect(0,y,VW,85);ctx.fillStyle=w.bg;ctx.fillRect(0,y+85,VW,worldH-85);if(i===0){for(let x=60;x<VW;x+=150){ctx.fillStyle='#5a3824';ctx.fillRect(x,y+150,10,55);ctx.fillStyle='#3e9e4b';ctx.beginPath();ctx.arc(x+5,y+135,35,0,7);ctx.fill()}}if(i===1){for(let x=50;x<VW;x+=125){ctx.fillStyle='#493322';ctx.fillRect(x,y+125,18,105);ctx.fillStyle='#2f7d45';ctx.beginPath();ctx.arc(x+9,y+112,45,0,7);ctx.fill()}}if(i===2){for(let x=70;x<VW;x+=180){ctx.fillStyle='#315f62';ctx.beginPath();ctx.ellipse(x,y+220,70,30,0,0,7);ctx.fill()}}if(i===3){ctx.fillStyle='#e1b15f';ctx.beginPath();ctx.moveTo(570,y+270);ctx.lineTo(710,y+100);ctx.lineTo(850,y+270);ctx.closePath();ctx.fill();ctx.strokeStyle='#8b5a2b';ctx.lineWidth=6;ctx.stroke();text('DESERT PYRAMID',710,y+305,11,'#fff')}if(i===4){for(let k=0;k<60;k++){ctx.fillStyle='#fff';ctx.fillRect((k*83)%VW,y+100+(k*47)%330,2,2)}ctx.fillStyle='#7254c6';ctx.beginPath();ctx.arc(160,y+220,65,0,7);ctx.fill();ctx.fillStyle='#b978ff';ctx.beginPath();ctx.arc(800,y+300,90,0,7);ctx.fill()}let m=mothers[i];motherSprite(i,m.x,m.y,1.4,Math.floor(performance.now()/180)%2);text(m.sleep?'Z Z':'!',m.x+35,m.y-42,18,m.sleep?'#fff':'#ff4545');for(const e of game.eggs.filter(e=>e.world===i&&!e.taken))eggSprite(i,e.x,e.y,1.1)}
function showArea(){let p=player.y;let a=p<plotY+plotH?'YOUR PLOT':p<safeY+safeH?'SAFE ZONE':worlds[Math.max(0,Math.min(4,Math.floor((p-worldBase)/worldH)))].name;if(a!==areaLast){areaLast=a;area.textContent=a;area.style.opacity=1;setTimeout(()=>area.style.opacity=0,1800)}}
function inSafe(){return player.y>=safeY&&player.y<safeY+safeH}function onTread(){return player.x>640&&player.x<900&&player.y>85&&player.y<155}
function interact(){let best=null,bd=65;for(const m of mothers){let d=Math.hypot(player.x-m.x,player.y-m.y);if(d<bd){best=m;bd=d}}if(best&&!best.angry&&!best.returning){best.sleep=false;best.angry=true;let w=worlds[best.world];game.holding={world:best.world};msg('🥚 STOLEN! '+w.name+' mother is chasing you!');return}for(const e of game.eggs){if(!e.taken&&Math.hypot(player.x-e.x,player.y-e.y)<45&&e.ready<=Date.now()){let p=pets[Math.min(4,Math.floor(Math.random()*pets.length))];game.pets.push(p);e.taken=true;msg('🎉 '+p[0]+' joined your plot!');return}}}
function msg(s){area.textContent=s;area.style.opacity=1;setTimeout(()=>{if(area.textContent===s)area.style.opacity=0},1700)}
c.addEventListener('click',e=>{if(!game.holding)return;let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*VW/r.width,y=(e.clientY-r.top)*VH/r.height+cam;if(y>=plotY+20&&y<=plotH-20&&x>=25&&x<=935){game.eggs.push({world:game.holding.world,x,y,ready:Date.now()+worlds[game.holding.world].hatch*1000,taken:false});game.holding=null;msg('🥚 Egg planted! You can steal another.')}});
function update(dt){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);let active=onTread(),mult=active?1+game.speedLevel*.35:1,speed=active?170*mult:150;if(dx||dy){let l=Math.hypot(dx,dy);player.vx=dx/l*speed;player.vy=dy/l*speed}else{player.vx=0;player.vy=active?0:0}if(active||dx||dy)player.anim+=dt*(active?10*mult:6*mult);player.x=Math.max(30,Math.min(930,player.x+player.vx*dt));player.y=Math.max(0,Math.min(totalH-20,player.y+player.vy*dt));if(inSafe()){mothers.forEach(m=>{if(m.angry){m.angry=false;m.returning=true}})}mothers.forEach(m=>{if(m.returning){let dx=m.homeX-m.x,dy=m.homeY-m.y,l=Math.hypot(dx,dy)||1;m.x+=dx/l*(130+m.world*30)*dt;m.y+=dy/l*(130+m.world*30)*dt;if(l<7){m.x=m.homeX;m.y=m.homeY;m.returning=false;m.sleep=true}}else if(m.angry){let dx=player.x-m.x,dy=player.y-m.y,l=Math.hypot(dx,dy)||1;m.x+=dx/l*worlds[m.world].speed*dt;m.y+=dy/l*worlds[m.world].speed*dt;if(l<38&&game.holding){game.eggs.push({world:game.holding.world,x:player.x,y:player.y,ready:Date.now()+worlds[game.holding.world].hatch*1000,taken:false});game.holding=null;player.x+=dx/l*85;player.y+=dy/l*85;m.angry=false;m.returning=true;msg('💥 CAUGHT! The egg was dropped!')}}});let income=game.pets.reduce((a,p)=>a+p[1],0);game.cash+=income*dt;if(income>0&&Math.random()<dt*1.4){let p=game.pets[Math.floor(Math.random()*game.pets.length)];float('+$'+p[1],110+Math.random()*730,115+Math.random()*100)}if(active&&Math.random()<dt*.9)float('+'+Math.round((mult-1)*100)+'% SPEED',player.x,player.y-40,'#73e9ff');if(Date.now()-game.lastReset>=300000){game.lastReset=Date.now();game.eggs=game.eggs.filter(e=>e.taken);mothers.forEach((m,i)=>{m.sleep=true;m.angry=false;m.returning=false;m.x=m.homeX;m.y=m.homeY});msg('🌙 Night reset! World eggs refreshed.')}}
function render(){ctx.clearRect(0,0,innerWidth,innerHeight);let scale=Math.min(innerWidth/VW,innerHeight/VH);ctx.save();ctx.scale(scale,scale);let ox=(innerWidth/scale-VW)/2;ctx.translate(ox,0);let target=player.y-VH*.55;cam+=(target-cam)*.12;cam=Math.max(0,Math.min(totalH-VH,cam));ctx.translate(0,-cam);drawPlot();ctx.fillStyle='#4b9cff';ctx.fillRect(0,safeY,VW,safeH);text('SAFE ZONE',35,safeY+55,15,'#fff','left');for(let i=0;i<worlds.length;i++)drawWorld(i,worlds[i]);if(game.holding)eggSprite(game.holding.world,player.x+20,player.y-15,1);playerSprite(player.x,player.y,1.25,Math.floor(player.anim)%4,!!game.holding);drawFloaters();ctx.restore();document.getElementById('cash').textContent=Math.floor(game.cash);document.getElementById('pets').textContent=game.pets.length+'/3';let mult=onTread()?1+game.speedLevel*.35:1;document.getElementById('speed').textContent=onTread()?'⚡ RUNNING +'+Math.round((mult-1)*100)+'% SPEED':'⚡ Speed '+mult.toFixed(2)+'x';let left=Math.max(0,300-(Date.now()-game.lastReset)/1000);document.getElementById('night').textContent=Math.floor(left/60)+':'+String(Math.ceil(left%60)).padStart(2,'0');showArea()}
let last=performance.now();function loop(n){let dt=Math.min(.04,(n-last)/1000);last=n;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
