<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steal a Pet</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101522;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#hud,#area,#hint{position:fixed;z-index:5;color:#fff;background:#182033;border:2px solid #0b0f18;box-shadow:3px 3px #0008;text-shadow:1px 1px #000}#hud{left:14px;top:14px;padding:8px 11px;line-height:1.45;font-weight:800}#area{left:50%;top:14px;transform:translateX(-50%);padding:8px 22px;font-size:18px;font-weight:900;opacity:0;transition:opacity .35s}#area.show{opacity:1}#hint{right:14px;bottom:14px;padding:6px 9px;font-size:11px}</style></head><body><canvas id="game" tabindex="0"></canvas><div id="hud">💰 $<span id="cash">100</span><br>🐾 Pets: <span id="pets">0</span><br>👟 Speed: <span id="speed">1</span><br>🌙 <span id="night">05:00</span></div><div id="area"></div><div id="hint">WASD / Arrows • E: steal / hatch • Click plot: plant</div><script>
'use strict';
const C=document.getElementById('game'),X=C.getContext('2d');X.imageSmoothingEnabled=false;const VW=240,VH=160;let cam=0,last=performance.now(),lastArea='';function fit(){C.width=innerWidth*devicePixelRatio;C.height=innerHeight*devicePixelRatio;let s=Math.min(innerWidth/VW,innerHeight/VH);X.setTransform(devicePixelRatio*s,0,0,devicePixelRatio*s,(innerWidth-devicePixelRatio*VW*s)/2,(innerHeight-devicePixelRatio*VH*s)/2);X.imageSmoothingEnabled=false}addEventListener('resize',fit);fit();
const worlds=[
{name:'MEADOW',bg:'#71bd61',rec:500,mother:'COW',ms:45,len:115,grow:18,colors:['#e8d49d','#f3cf54','#8bdc72','#e7ad49','#75d8e8','#ffd34f','#f1a8df','#55d97a']},
{name:'FOREST',bg:'#397943',rec:900,mother:'WOLF',ms:70,len:145,grow:25,colors:['#9bd7a0','#70ad68','#b8894c','#b9d8ee','#7fc8e8','#c7a6df','#f0b7e7','#82e4d0']},
{name:'SWAMP',bg:'#2b6258',rec:1600,mother:'CROCODILE',ms:100,len:180,grow:34,colors:['#91d29a','#73b66e','#9c8053','#7fcb77','#b3e46b','#e6e8ef','#c1a2dd','#45d3a5']},
{name:'DESERT',bg:'#d29a53',rec:2500,mother:'DRAGON',ms:135,len:215,grow:45,colors:['#ead08b','#76b85b','#e7ae68','#49b5b2','#e85a4f','#ffdc57','#c6a0e0','#f07d47']},
{name:'COSMOS',bg:'#29234c',rec:4000,mother:'VOID MONSTER',ms:180,len:260,grow:60,colors:['#aaa0c9','#d7e7ff','#c18be8','#d6d8e8','#7da9ff','#8d68cf','#f0c9ff','#6cf0e3']}];
const base=155,plotH=85,safeH=30,starts=[];let yy=base;worlds.forEach(w=>{starts.push(yy);yy+=w.len});const totalH=yy;
const rarity=[{n:'Common',w:55,m:1},{n:'Uncommon',w:25,m:1.4},{n:'Rare',w:11,m:2.2},{n:'Epic',w:5,m:3.5},{n:'Legendary',w:2.5,m:6},{n:'Mythic',w:1,m:10},{n:'Cosmic',w:.4,m:18},{n:'Secret',w:.1,m:40}];
const petTypes=[{n:'Bunny',inc:8,c:'#f0d5df',k:0},{n:'Pup',inc:14,c:'#b97b45',k:1},{n:'Fox',inc:22,c:'#e66b30',k:2},{n:'Baby Dragon',inc:40,c:'#61c96a',k:3},{n:'Cosmo Cat',inc:80,c:'#ae78ea',k:4}];
let game={cash:100,speed:1,tread:0,upgrade:1,lastReset:Date.now(),holding:null,plotEggs:[],owned:[],worldEggs:[]};let p={x:120,y:105,vx:0,vy:0,walk:0,face:1};const keys={};
function chance(){let total=rarity.reduce((a,r)=>a+r.w,0),v=Math.random()*total;for(let i=0;i<rarity.length;i++){v-=rarity[i].w;if(v<=0)return i}return 0}
function makeEgg(i,x,y){let r=chance(),w=worlds[i];return{world:i,type:Math.floor(Math.random()*8),rarity:rarity[r],size:r>=5?1.65+Math.random()*.8:r>=3?1.2+Math.random()*.3:.7+Math.random()*.3,x,y,ready:Date.now()+w.grow*1000*(.7+r*.22),picked:false}}
function spawnWorld(i){game.worldEggs=game.worldEggs.filter(e=>e.world!==i);let m=mothers[i];for(let k=0;k<5;k++){let a=(k/5)*Math.PI*2+Math.random()*.5;let rr=18+Math.random()*18;game.worldEggs.push(makeEgg(i,m.x+Math.cos(a)*rr,m.y+Math.sin(a)*rr))}}
const mothers=worlds.map((w,i)=>({world:i,x:120,y:starts[i]+w.len*.55,homeX:120,homeY:starts[i]+w.len*.55,angry:false}));worlds.forEach((_,i)=>spawnWorld(i));
function text(t,x,y,n=7,col='#fff',a='center'){X.font='bold '+n+'px Arial,sans-serif';X.textAlign=a;X.fillStyle=col;X.strokeStyle='#11131a';X.lineWidth=1.5;X.strokeText(t,x,y);X.fillText(t,x,y)}
function popup(t){area.textContent=t;area.classList.add('show');clearTimeout(popup.t);popup.t=setTimeout(()=>area.classList.remove('show'),1300)}
function rect(x,y,w,h,c){X.fillStyle=c;X.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function pixelEgg(e){let s=Math.round(e.size*2),x=Math.round(e.x),y=Math.round(e.y),c=worlds[e.world].colors[e.type];rect(x-2*s,y-5*s,4*s,10*s,c);rect(x-4*s,y-2*s,8*s,6*s,c);rect(x-3*s,y-4*s,6*s,2*s,c);rect(x-2*s,y+5*s,4*s,2*s,'#11131a');rect(x-1*s,y-3*s,1*s,2*s,'#fff');if(e.ready<=Date.now())text('READY',x,y-8*s-2,5,'#fff')}
function player(){let f=Math.floor(p.walk)%4,leg=f===1||f===2?1:-1;let x=Math.round(p.x),y=Math.round(p.y);rect(x-3,y-11,6,7,'#efb88c');rect(x-3,y-14,6,3,'#3b2922');rect(x-5,y-4,10,8,'#e24d45');rect(x-7,y-3,2,6,'#efb88c');rect(x+5,y-3,2,6,'#efb88c');if(leg>0){rect(x-4,y+4,3,7,'#26344a');rect(x+2,y+4,3,5,'#26344a')}else{rect(x-4,y+4,3,5,'#26344a');rect(x+2,y+4,3,7,'#26344a')}rect(x-5,y+10,4,2,'#151923');rect(x+2,y+10,4,2,'#151923');if(game.holding)pixelEgg({x:x+9,y:y-1,size:game.holding.size,world:game.holding.world,type:game.holding.type,ready:Infinity})}
function petSprite(d,x,y,t){let bob=Math.round(Math.sin(t)*1),flap=Math.round(Math.sin(t*2)*2);x=Math.round(x);y=Math.round(y+bob);let c=d.c;if(d.k===0){rect(x-7,y-2,14,7,c);rect(x-5,y-7,10,6,c);rect(x-7,y-12,3,6,c);rect(x+4,y-12,3,6,c);rect(x-4,y-5,2,2,'#111');rect(x+2,y-5,2,2,'#111');rect(x-3,y+5,2,4,'#111');rect(x+1,y+5,2,4,'#111')}else if(d.k===1){rect(x-8,y-2,15,8,c);rect(x+5,y-6,6,7,c);rect(x-6,y-6,4,4,c);rect(x+8,y-4,3,2,'#111');rect(x-5,y+5,2,3,'#111');rect(x+3,y+5,2,3,'#111')}else if(d.k===2){rect(x-8,y-2,15,7,c);rect(x+5,y-7,7,7,c);rect(x+7,y-11,3,5,c);rect(x-10,y-7,5,3,c);rect(x+7,y-5,2,2,'#111');rect(x-4,y+5,2,3,'#111');rect(x+3,y+5,2,3,'#111')}else if(d.k===3){rect(x-8,y-2,16,8,c);rect(x+5,y-8,7,8,c);rect(x-5,y-7,4,5,'#3c9b4c');rect(x-11,y-9-flap,7,4,'#3c9b4c');rect(x+6,y-9+flap,7,4,'#3c9b4c');rect(x+8,y-6,2,2,'#111');rect(x-5,y+5,2,3,'#111');rect(x+3,y+5,2,3,'#111')}else{rect(x-7,y-2,15,9,c);rect(x-5,y-8,11,7,c);rect(x-7,y-12,3,5,c);rect(x+4,y-12,3,5,c);rect(x-3,y-6,2,2,'#fff');rect(x+3,y-6,2,2,'#fff');rect(x-2,y-6,1,1,'#111');rect(x+4,y-6,1,1,'#111')}}
function bushes(i,y){let seed=i*1337+9;for(let n=0;n<10;n++){seed=(seed*9301+49297)%233280;let x=8+(seed/233280)*224;seed=(seed*9301+49297)%233280;let yy=y+18+(seed/233280)*(worlds[i].len-30);let c=i===3?'#70883a':i===2?'#1b4d45':i===1?'#255c36':'#3f9145';rect(x,yy,4,3,c);rect(x-3,yy+3,10,4,c);rect(x+1,yy-3,4,3,c)}}
function world(i){let w=worlds[i],y=starts[i];rect(0,y,VW,w.len,w.bg);bushes(i,y);if(i===1)for(let x=15;x<230;x+=38){rect(x,y+45,4,35,'#285b35');rect(x-5,y+42,14,6,'#255a34')}if(i===2)for(let x=20;x<230;x+=48){rect(x,y+85,12,3,'#9bd083');rect(x+5,y+75,3,14,'#355b4d')}if(i===3){rect(168,y+125,45,5,'#dcae61');for(let k=0;k<3;k++)rect(184+k*8,y+100-k*12,6,6,'#c28a48');text('DESERT RUINS',188,y+145,5,'#6d4827')}if(i===4){for(let k=0;k<55;k++){rect((k*43)%240,y+10+(k*29)%(w.len-15),1,1,'#fff')}}let m=mothers[i];mother(i,m);game.worldEggs.filter(e=>e.world===i&&!e.picked).forEach(pixelEgg)}
function mother(i,m){let c=['#b87949','#68717d','#47766b','#7f4f35','#8255b7'][i];rect(m.x-10,m.y-5,20,10,c);rect(m.x+7,m.y-10,8,8,c);rect(m.x-5,m.y-9,6,5,c);rect(m.x+11,m.y-7,2,2,'#fff');text(m.angry?'!':'Z',m.x+18,m.y-10,8,m.angry?'#ff5555':'#fff')}
function plot(){rect(0,0,VW,plotH,'#6fc261');X.strokeStyle='#30231c';X.lineWidth=3;X.strokeRect(4,4,VW-8,plotH-8);text('YOUR PET HABITAT',9,14,8,'#fff','left');game.owned.forEach((d,i)=>{if(d.x==null){d.x=15+Math.random()*210;d.y=28+Math.random()*45;d.tx=d.x;d.ty=d.y}if(Math.random()<.012){d.tx=12+Math.random()*216;d.ty=28+Math.random()*45}let dx=d.tx-d.x,dy=d.ty-d.y,l=Math.hypot(dx,dy)||1;d.x+=dx/l*.3;d.y+=dy/l*.3;petSprite(d,d.x,d.y,performance.now()/180+i)});game.plotEggs.filter(e=>!e.hatched).forEach(pixelEgg);treadmill()}
function treadmill(){let x=135,y=118;rect(x,y,55,18,'#343b49');X.strokeStyle='#10131a';X.lineWidth=2;X.strokeRect(x,y,55,18);rect(x+4,y+11,47,4,'#10131a');for(let i=0;i<7;i++)rect(x+6+i*7-(Math.floor(performance.now()/80)%7),y+12,4,1,'#adb5c3');rect(x+45,y-8,3,19,'#151923');rect(x+32,y-8,16,3,'#151923');rect(x-2,y+19,35,14,'#202638');X.strokeRect(x-2,y+19,35,14);text('👟 '+game.speed,x+2,y+26,6,'#ffe66b','left');text('LV '+game.upgrade,x+2,y+31,5,'#9cff91','left')}
function safe(){return p.y>=plotH&&p.y<base}function onTread(){return safe()&&p.x>132&&p.x<192&&p.y>115&&p.y<140}
function interact(){if(game.holding)return;for(const e of game.worldEggs){if(!e.picked&&Math.hypot(p.x-e.x,p.y-e.y)<10){e.picked=true;game.holding={world:e.world,type:e.type,size:e.size,rarity:e.rarity};mothers[e.world].angry=true;return}}for(const e of game.plotEggs){if(!e.hatched&&e.ready<=Date.now()&&Math.hypot(p.x-e.x,p.y-e.y)<12){let d=petTypes[Math.floor(Math.random()*petTypes.length)];game.owned.push({...d,x:e.x,y:e.y,tx:e.x,ty:e.y});e.hatched=true;return}}}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright','e'].includes(k))e.preventDefault();keys[k]=true;if(k==='e')interact()},{passive:false});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);C.addEventListener('pointerdown',e=>{C.focus();let r=C.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*VW,y=(e.clientY-r.top)/r.height*VH+cam;if(x>130&&x<205&&y>135&&y<160){let cost=game.upgrade*500;if(game.cash>=cost){game.cash-=cost;game.upgrade++;return}}if(game.holding&&x>5&&x<VW-5&&y<plotH-4){let q=game.holding;let dur=worlds[q.world].grow*1000*(.8+q.rarity.m*.25);game.plotEggs.push({world:q.world,type:q.type,size:q.size,rarity:q.rarity,planted:Date.now(),duration:dur,ready:Date.now()+dur,hatched:false,x,y});game.holding=null}});
function update(dt){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);let tr=onTread();if(dx||dy){let l=Math.hypot(dx,dy),heavy=game.holding&&game.holding.size>1.55?1/(1+(game.holding.size-1.55)*1.5):1,walk=(42+game.speed*2.5)*heavy;p.vx=dx/l*walk;p.vy=dy/l*walk;p.walk+=dt*(tr?12:7);if(dx)p.face=dx>0?1:-1}else{p.vx=p.vy=0;if(tr)p.walk+=dt*9}p.x=Math.max(8,Math.min(232,p.x+p.vx*dt));p.y=Math.max(0,Math.min(totalH-8,p.y+p.vy*dt));if(tr){game.tread+=dt;if(game.tread>=1){game.speed++;game.tread-=1}}else game.tread=0;for(const m of mothers){if(m.angry&&!safe()){let dx=p.x-m.x,dy=p.y-m.y,l=Math.hypot(dx,dy)||1;m.x+=dx/l*worlds[m.world].ms*dt;m.y+=dy/l*worlds[m.world].ms*dt;if(l<10&&game.holding){let q=game.holding;game.plotEggs.push({world:q.world,type:q.type,size:q.size,rarity:q.rarity,planted:Date.now(),duration:worlds[q.world].grow*1000,ready:Date.now()+worlds[q.world].grow*1000,hatched:false,x:p.x,y:p.y});game.holding=null;m.angry=false;p.x-=dx/l*10;p.y-=dy/l*10}}if(safe())m.angry=false}game.cash+=game.owned.reduce((s,d)=>s+d.inc,0)*dt;if(Date.now()-game.lastReset>=300000){game.lastReset=Date.now();worlds.forEach((_,i)=>spawnWorld(i))}}
function render(){fit();cam+=(p.y-VH*.52-cam)*.1;cam=Math.max(0,Math.min(totalH-VH,cam));X.save();X.translate(0,-Math.round(cam));plot();rect(0,plotH,VW,safeH,'#68b85c');for(let i=0;i<worlds.length;i++)world(i);player();X.restore();document.getElementById('cash').textContent=Math.floor(game.cash);document.getElementById('pets').textContent=game.owned.length;document.getElementById('speed').textContent=game.speed;let left=Math.max(0,300-(Date.now()-game.lastReset)/1000);document.getElementById('night').textContent=Math.floor(left/60)+':'+String(Math.ceil(left%60)).padStart(2,'0');let a=p.y<plotH?'YOUR PLOT':safe()?'SAFE AREA':(()=>{for(let i=worlds.length-1;i>=0;i--)if(p.y>=starts[i])return worlds[i].name;return 'MEADOW'})();let isWorld=worlds.some(w=>w.name===a);if(a!==lastArea){let wasWorld=worlds.some(w=>w.name===lastArea);lastArea=a;if(isWorld&&!wasWorld)popup(a)}}function loop(n){let dt=Math.min(.033,(n-last)/1000);last=n;update(dt);render();requestAnimationFrame(loop)}C.focus();requestAnimationFrame(loop);
</script></body></html>
