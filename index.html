<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steal a Pet</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101522;font-family:monospace}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#hud,#hint,#area{position:fixed;z-index:5;color:#fff;background:#171b28;border:3px solid #0d1018;box-shadow:4px 4px 0 #0008;font-weight:900;text-shadow:2px 2px #000}#hud{left:14px;top:14px;padding:10px 13px;line-height:1.55}#hint{right:14px;bottom:14px;padding:8px 10px;font-size:11px}#area{left:50%;top:14px;transform:translateX(-50%);padding:9px 24px;font-size:18px;opacity:0;transition:opacity .3s}#area.show{opacity:1}</style></head><body><canvas id="game"></canvas><div id="hud">💰 $<span id="cash">100</span><br>🐾 Pets: <span id="pets">0</span><br>⚡ Speed: <span id="speed">1</span><br>🌙 <span id="night">05:00</span></div><div id="area"></div><div id="hint">WASD / Arrows: move • E: steal / hatch • Click plot: plant • Click sign: upgrade</div><script>
'use strict';const C=document.getElementById('game'),X=C.getContext('2d');X.imageSmoothingEnabled=false;const W=960,H=640;let cam=0,last=performance.now(),lastArea='';function fit(){C.width=innerWidth*devicePixelRatio;C.height=innerHeight*devicePixelRatio;let s=Math.min(innerWidth/W,innerHeight/H);X.setTransform(devicePixelRatio*s,0,0,devicePixelRatio*s,(innerWidth-devicePixelRatio*W*s)/2,(innerHeight-devicePixelRatio*H*s)/2);X.imageSmoothingEnabled=false}addEventListener('resize',fit);fit();
const worlds=[{name:'MEADOW',desc:'Green Pastures',bg:'#69b85a',mother:'COW',rec:500,speed:80,len:500,egg:'#ffe1a0',grow:18},{name:'FOREST',desc:'Whispering Woods',bg:'#347b42',mother:'WOLF',rec:900,speed:125,len:650,egg:'#bfe8ff',grow:25},{name:'SWAMP',desc:'Murky Marsh',bg:'#285e55',mother:'CROCODILE',rec:1600,speed:180,len:820,egg:'#9de5a2',grow:34},{name:'DESERT',desc:'Sunken Sands',bg:'#d49b52',mother:'DRAGON',rec:2500,speed:250,len:1020,egg:'#ffb178',grow:45},{name:'COSMOS',desc:'Outer Void',bg:'#292149',mother:'VOID MONSTER',rec:4000,speed:330,len:1250,egg:'#d9b1ff',grow:60}];
const defs=[{n:'Bunny',inc:8,c:'#f0d7df',type:0},{n:'Pup',inc:14,c:'#b87842',type:1},{n:'Fox',inc:22,c:'#e66c2e',type:2},{n:'Baby Dragon',inc:40,c:'#5fc76a',type:3},{n:'Cosmo Cat',inc:80,c:'#aa76e8',type:4}];const plotH=340,safeH=110,base=450,starts=[];let yy=base;worlds.forEach(w=>{starts.push(yy);yy+=w.len});const totalH=yy;let game={cash:100,pets:[],eggs:[],holding:null,speed:1,treadTime:0,upgrade:1,lastReset:Date.now()},p={x:480,y:390,vx:0,vy:0,walk:0,face:1};const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);let floats=[];
const mothers=worlds.map((w,i)=>({world:i,x:700,y:starts[i]+w.len*.55,homeX:700,homeY:starts[i]+w.len*.55,angry:false,nests:[-80,0,80].map(a=>({a:a*Math.PI/180,filled:true,size:.65+Math.random()*.45}))}));
function text(t,x,y,n=12,col='#fff',a='center'){X.font='900 '+n+'px monospace';X.textAlign=a;X.fillStyle=col;X.strokeStyle='#11131c';X.lineWidth=3;X.strokeText(t,x,y);X.fillText(t,x,y)}function pop(t){area.textContent=t;area.classList.add('show');clearTimeout(pop.t);pop.t=setTimeout(()=>area.classList.remove('show'),1400)}function fl(t,x,y,col='#ffe66b'){floats.push({t,x,y,col,t0:performance.now()})}function drawFloats(){let n=performance.now();floats=floats.filter(f=>n-f.t0<950);for(const f of floats){let q=(n-f.t0)/950;X.globalAlpha=1-q;text(f.t,f.x,f.y-q*42,14,f.col);X.globalAlpha=1}}
function outline(){X.strokeStyle='#141722';X.lineWidth=3}function egg(x,y,col,s=1){X.save();X.translate(x,y);X.scale(s,s);X.fillStyle=col;outline();X.beginPath();X.moveTo(0,-18);X.bezierCurveTo(11,-14,13,2,10,9);X.bezierCurveTo(7,20,-8,20,-11,9);X.bezierCurveTo(-14,0,-9,-14,0,-18);X.closePath();X.fill();X.stroke();X.fillStyle='#fff8';X.fillRect(-5,-11,4,6);X.restore()}
function person(x,y,ph,run,holding,face){X.save();X.translate(x,y);X.scale(face,1);let s=Math.sin(ph)*(run?11:7);outline();X.lineWidth=6;X.beginPath();X.moveTo(-6,17);X.lineTo(-10+s,42);X.moveTo(6,17);X.lineTo(10-s,42);X.stroke();X.fillStyle='#e85b4f';X.fillRect(-12,-8,24,26);X.strokeRect(-12,-8,24,26);X.fillStyle='#efbb8e';X.beginPath();X.arc(0,-21,12,0,7);X.fill();X.stroke();X.fillStyle='#432b20';X.fillRect(-11,-32,22,8);X.strokeStyle='#efbb8e';X.lineWidth=6;X.beginPath();X.moveTo(-10,0);X.lineTo(-20-s*.4,15);X.moveTo(10,0);X.lineTo(20+s*.4,15);X.stroke();if(holding)egg(20,-8,worlds[holding.world].egg,.65);X.restore()}
function petSprite(d,x,y,ph,scale=1){X.save();X.translate(x,y);X.scale(scale,scale);let bob=Math.sin(ph)*2,step=Math.sin(ph*1.7)*3;X.translate(0,bob);outline();if(d.type===0){X.fillStyle=d.c;X.beginPath();X.ellipse(0,5,21,15,0,0,7);X.fill();X.stroke();X.beginPath();X.moveTo(-13,-5);X.lineTo(-18,-27);X.lineTo(-5,-13);X.closePath();X.fill();X.stroke();X.beginPath();X.moveTo(13,-5);X.lineTo(18,-27);X.lineTo(5,-13);X.closePath();X.fill();X.stroke();X.fillStyle='#fff';X.fillRect(-9,-3,6,6);X.fillRect(3,-3,6,6);X.fillStyle='#222';X.fillRect(-7,-1,3,3);X.fillRect(5,-1,3,3)}else if(d.type===1){X.fillStyle=d.c;X.beginPath();X.ellipse(0,4,24,15,0,0,7);X.fill();X.stroke();X.beginPath();X.arc(19,-9,14,0,7);X.fill();X.stroke();X.fillStyle='#171923';X.fillRect(22,-11,3,3);X.fillStyle='#d9a77c';X.fillRect(-21,-4,8,5)}else if(d.type===2){X.fillStyle=d.c;X.beginPath();X.moveTo(-23,12);X.lineTo(-9,-13);X.lineTo(10,-17);X.lineTo(25,5);X.lineTo(8,16);X.closePath();X.fill();X.stroke();X.fillStyle='#f5c28d';X.beginPath();X.moveTo(-7,-9);X.lineTo(0,-20);X.lineTo(8,-9);X.closePath();X.fill();X.stroke();X.fillStyle='#fff';X.fillRect(8,-11,5,5)}else if(d.type===3){X.fillStyle=d.c;X.beginPath();X.ellipse(0,3,25,16,0,0,7);X.fill();X.stroke();X.beginPath();X.arc(21,-10,13,0,7);X.fill();X.stroke();X.fillStyle='#3e9d4d';X.beginPath();X.moveTo(-3,-5);X.lineTo(-23,-24-Math.sin(ph*2)*5);X.lineTo(-9,-12);X.closePath();X.fill();X.stroke();X.beginPath();X.moveTo(2,-5);X.lineTo(22,-24+Math.sin(ph*2)*5);X.lineTo(9,-12);X.closePath();X.fill();X.stroke();X.fillStyle='#fff';X.fillRect(24,-13,4,4)}else{X.fillStyle=d.c;X.beginPath();X.arc(0,0,21,0,7);X.fill();X.stroke();X.fillStyle='#6b4aaa';X.beginPath();X.moveTo(-17,-14);X.lineTo(-10,-28);X.lineTo(-2,-17);X.closePath();X.fill();X.stroke();X.beginPath();X.moveTo(17,-14);X.lineTo(10,-28);X.lineTo(2,-17);X.closePath();X.fill();X.stroke();X.fillStyle='#fff';X.fillRect(-10,-4,6,6);X.fillRect(4,-4,6,6)}X.restore()}
function treadmill(){let x=570,y=100,w=270;X.fillStyle='#252a35';X.fillRect(x,y,w,75);outline();X.strokeRect(x,y,w,75);X.fillStyle='#0e1118';X.fillRect(x+14,y+40,w-28,22);for(let i=0;i<9;i++){X.fillStyle='#aab2bf';X.fillRect(x+15+i*30-(performance.now()/4%30),y+47,18,4)}X.strokeStyle='#11131c';X.lineWidth=8;X.beginPath();X.moveTo(x+w-35,y+45);X.lineTo(x+w-35,y-25);X.lineTo(x+w-110,y-25);X.stroke();X.fillStyle='#202638';X.fillRect(x-4,y+82,150,68);outline();X.strokeRect(x-4,y+82,150,68);text('SPEED '+game.speed,x+8,y+105,11,'#ffe56b','left');text('UPGRADE',x+8,y+125,10,'#fff','left');text('$'+game.upgrade*500,x+8,y+140,10,'#9cff91','left')}
function plot(){X.fillStyle='#73c866';X.fillRect(0,0,W,plotH);outline();X.lineWidth=9;X.strokeRect(18,18,W-36,plotH-36);text('YOUR PET HABITAT',34,52,20,'#fff','left');treadmill();let t=performance.now()/180;game.pets.forEach((d,i)=>{if(!d.x){d.x=100+Math.random()*700;d.y=115+Math.random()*180;d.dx=(Math.random()>.5?1:-1)}d.x+=d.dx*.22;if(d.x<55||d.x>900)d.dx*=-1;petSprite(d,d.x,d.y,t+i*3,.85);text(d.n,d.x,d.y-31,9)});game.eggs.filter(e=>!e.taken&&e.y<plotH).forEach(e=>{let g=Math.min(1,(Date.now()-e.planted)/e.duration);egg(e.x,e.y,worlds[e.world].egg,e.size*(.8+.35*g));text(e.ready<=Date.now()?'READY!':Math.ceil((e.ready-Date.now())/1000)+'s',e.x,e.y-27,9)})}
function bush(x,y,col){X.fillStyle=col;outline();X.fillRect(x-13,y-8,26,16);X.fillRect(x-8,y-16,16,24);X.strokeRect(x-13,y-8,26,16)}function world(i){let w=worlds[i],y=starts[i];X.fillStyle=w.bg;X.fillRect(0,y,W,w.len);text(w.name+' — '+w.desc,28,y+42,18,'#fff','left');X.fillStyle='#8b623d';X.fillRect(35,y+62,240,58);outline();X.strokeRect(35,y+62,240,58);text('RECOMMENDED SPEED',48,y+84,10,'#fff','left');text(w.rec+'+',48,y+105,16,'#ffe56b','left');text(w.mother,160,y+105,12,'#fff','left');if(i===0){for(let x=70;x<900;x+=150)bush(x,y+170,'#3e9144')}if(i===1){for(let x=60;x<900;x+=120){bush(x,y+170,'#245d35');X.fillStyle='#1e5230';X.fillRect(x+4,y+185,6,90)}}if(i===2){for(let x=70;x<900;x+=180)bush(x,y+160,'#1d5149')}if(i===3){X.fillStyle='#e6b96b';X.beginPath();X.moveTo(560,y+320);X.lineTo(700,y+95);X.lineTo(840,y+320);X.closePath();X.fill();outline();X.stroke();for(let x=80;x<900;x+=180)bush(x,y+210,'#7e873b')}if(i===4){for(let k=0;k<90;k++){X.fillStyle='#eee';X.fillRect((k*97)%W,y+140+(k*41)%(w.len-160),2,2)}}let m=mothers[i];motherDraw(i,m);m.nests.forEach(n=>{if(n.filled)egg(m.homeX+Math.cos(n.a)*125,m.homeY+Math.sin(n.a)*75,w.egg,n.size)})}
function motherDraw(i,m){let col=['#b87948','#65707d','#47776c','#815037','#8454b8'][i],ph=performance.now()/180;X.save();X.translate(m.x,m.y+Math.sin(ph)*2);X.fillStyle=col;outline();X.beginPath();X.ellipse(0,4,31,21,0,0,7);X.fill();X.stroke();X.beginPath();X.arc(25,-12,16,0,7);X.fill();X.stroke();X.fillStyle='#fff';X.fillRect(27,-16,6,6);X.fillStyle='#111';X.fillRect(29,-14,3,3);X.restore();text(m.angry?'!':'Z Z',m.x+45,m.y-35,14,m.angry?'#ff5555':'#fff')}
function safe(){return p.y>=plotH&&p.y<base}function tread(){return p.x>570&&p.x<840&&p.y<180}function interact(){if(game.holding)return;for(const m of mothers)for(const n of m.nests){let ex=m.homeX+Math.cos(n.a)*125,ey=m.homeY+Math.sin(n.a)*75;if(n.filled&&Math.hypot(p.x-ex,p.y-ey)<48){n.filled=false;game.holding={world:m.world};m.angry=true;setTimeout(()=>n.filled=true,2500);pop('🥚 EGG STOLEN!');return}}for(const e of game.eggs)if(!e.taken&&e.ready<=Date.now()&&Math.hypot(p.x-e.x,p.y-e.y)<48){game.pets.push({...defs[e.pet],x:e.x,y:e.y,dx:Math.random()>.5?1:-1});e.taken=true;pop('🎉 '+defs[e.pet].n+' HATCHED!');return}}
C.addEventListener('click',e=>{let r=C.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H+cam;if(x>565&&x<850&&y>178&&y<260){let cost=game.upgrade*500;if(game.cash>=cost){game.cash-=cost;game.upgrade++;pop('TREADMILL LEVEL '+game.upgrade+'!');}return}if(!game.holding)return;if(y<plotH-20&&x>25&&x<W-25){let wi=game.holding.world,pi=Math.floor(Math.random()*defs.length),dur=worlds[wi].grow*1000*(1+defs[pi].inc/40);game.eggs.push({world:wi,x,y,planted:Date.now(),duration:dur,ready:Date.now()+dur,pet:pi,taken:false,size:.55+Math.random()*.65});game.holding=null;pop('🥚 EGG PLANTED!')}});
function update(dt){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),tr=tread(),spd=150+Math.max(0,game.speed-1)*18;if(dx||dy){let l=Math.hypot(dx,dy);p.vx=dx/l*spd;p.vy=dy/l*spd;p.walk+=dt*(tr?15:8);if(dx)p.face=dx>0?1:-1}else{p.vx=0;p.vy=0;if(tr)p.walk+=dt*10}p.x=Math.max(35,Math.min(925,p.x+p.vx*dt));p.y=Math.max(0,Math.min(totalH-35,p.y+p.vy*dt));if(tr){game.treadTime+=dt;if(game.treadTime>=1){let n=Math.floor(game.treadTime);game.speed+=n;game.treadTime-=n;fl('+'+n+' SPEED',p.x,p.y-45,'#66e8ff')}}else game.treadTime=0;mothers.forEach(m=>{if(safe()&&m.angry){m.angry=false;m.x=m.homeX;m.y=m.homeY}if(m.angry){let dx=p.x-m.x,dy=p.y-m.y,l=Math.hypot(dx,dy)||1,v=worlds[m.world].speed+(Math.hypot(m.x-m.homeX,m.y-m.homeY)*.24);m.x+=dx/l*v*dt;m.y+=dy/l*v*dt;if(l<40&&game.holding){game.eggs.push({world:m.world,x:p.x,y:p.y,planted:Date.now(),duration:worlds[m.world].grow*1000,ready:Date.now()+worlds[m.world].grow*1000,pet:0,taken:false,size:.8});game.holding=null;m.angry=false;pop('💥 CAUGHT! EGG DROPPED!')}}});game.pets.forEach((d,i)=>{d.x+=d.dx*(18+d.inc)*dt;d.y+=Math.sin(performance.now()/500+i)*.12;if(d.x<55||d.x>900)d.dx*=-1});let inc=game.pets.reduce((s,d)=>s+d.inc,0);game.cash+=inc*dt;if(inc&&Math.random()<dt*1.4){let d=game.pets[Math.floor(Math.random()*game.pets.length)];fl('+$'+d.inc,100+Math.random()*760,110+Math.random()*140)}if(Date.now()-game.lastReset>=300000){game.lastReset=Date.now();mothers.forEach(m=>m.nests.forEach(n=>n.filled=true));game.eggs=[];pop('🌙 NIGHT RESET')}}
function render(){fit();X.clearRect(0,0,innerWidth,innerHeight);cam+=(p.y-H*.55-cam)*.12;cam=Math.max(0,Math.min(totalH-H,cam));X.save();X.translate(0,-cam);plot();X.fillStyle='#73c866';X.fillRect(0,plotH,W,safeH);for(let i=0;i<worlds.length;i++)world(i);if(game.holding)egg(p.x+20,p.y-8,worlds[game.holding.world].egg,.65);person(p.x,p.y,p.walk,tread(),!!game.holding,p.face);drawFloats();X.restore();cash.textContent=Math.floor(game.cash);pets.textContent=game.pets.length;speed.textContent=game.speed;let left=Math.max(0,300-(Date.now()-game.lastReset)/1000);night.textContent=Math.floor(left/60)+':'+String(Math.ceil(left%60)).padStart(2,'0');let idx=worlds.findIndex((w,i)=>p.y>=starts[i]&&p.y<starts[i]+w.len);let name=p.y<plotH?'YOUR PLOT':safe()?'SAFE AREA':idx>=0?worlds[idx].name:'MEADOW';if(name!==lastArea){lastArea=name;pop(name)}}function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
