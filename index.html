<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steal a Pet</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101522;font-family:monospace}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#hud,#hint,#area{position:fixed;z-index:5;color:#fff;background:#171b28;border:3px solid #0d1018;box-shadow:4px 4px 0 #0008;font-weight:900;text-shadow:2px 2px #000}#hud{left:14px;top:14px;padding:10px 13px;line-height:1.55}#hint{right:14px;bottom:14px;padding:8px 10px;font-size:11px}#area{left:50%;top:14px;transform:translateX(-50%);padding:9px 24px;font-size:18px;opacity:0;transition:opacity .3s}#area.show{opacity:1}</style></head><body><canvas id="game"></canvas><div id="hud">💰 $<span id="cash">100</span><br>🐾 Pets: <span id="pets">0</span><br>⚡ Speed: <span id="speed">1</span><br>🌙 <span id="night">05:00</span></div><div id="area"></div><div id="hint">WASD / Arrows: move • E: steal / collect • Click plot: plant • Click upgrade sign: upgrade</div><script>
'use strict';const C=document.getElementById('game'),X=C.getContext('2d');X.imageSmoothingEnabled=false;const W=960,H=640;let cam=0,last=performance.now(),lastArea='';function fit(){C.width=innerWidth*devicePixelRatio;C.height=innerHeight*devicePixelRatio;X.setTransform(devicePixelRatio,0,0,devicePixelRatio,(innerWidth-W*devicePixelRatio)/2,(innerHeight-H*devicePixelRatio)/2);X.imageSmoothingEnabled=false}addEventListener('resize',fit);fit();
const worlds=[['MEADOW','#70bd5f','cow',60,460,'#ffe2a1',18],['FOREST','#397d43','wolf',76,580,'#bfe8ff',25],['SWAMP','#2d6258','croc',94,720,'#9de5a2',34],['DESERT','#d7a25b','dragon',112,880,'#ffb37d',45],['COSMOS','#2b244f','monster',132,1060,'#dcb5ff',60]],defs=[['Bunny',8,'#f2d9e0'],['Pup',14,'#c98b52'],['Fox',22,'#e86e32'],['Baby Dragon',40,'#68ca6d'],['Cosmo Cat',80,'#b57fec']],plotH=340,safeH=110,base=450,starts=[];let yy=base;worlds.forEach(w=>{starts.push(yy);yy+=w[4]});const totalH=yy;let game={cash:100,pets:[],eggs:[],holding:null,speed:1,treadTime:0,upgrade:1,lastReset:Date.now()},p={x:480,y:390,vx:0,vy:0,walk:0,face:1};const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);const mothers=worlds.map((w,i)=>{let x=690,y=starts[i]+w[4]*.55;return{world:i,x,y,homeX:x,homeY:y,angry:false,sleep:true,nests:[-95,25,145].map(a=>({a:a*Math.PI/180,filled:true}))}});let floats=[];function text(t,x,y,n=12,col='#fff',a='center'){X.font='900 '+n+'px monospace';X.textAlign=a;X.fillStyle=col;X.strokeStyle='#11131c';X.lineWidth=3;X.strokeText(t,x,y);X.fillText(t,x,y)}function pop(t){area.textContent=t;area.classList.add('show');clearTimeout(pop.t);pop.t=setTimeout(()=>area.classList.remove('show'),1300)}function fl(t,x,y,col='#ffe66b'){floats.push({t,x,y,col,t0:performance.now()})}function drawFloats(){let n=performance.now();floats=floats.filter(f=>n-f.t0<900);for(let f of floats){let q=(n-f.t0)/900;X.globalAlpha=1-q;text(f.t,f.x,f.y-q*40,14,f.col);X.globalAlpha=1}}function borderRect(x,y,w,h){X.strokeStyle='#11131c';X.lineWidth=5;X.strokeRect(x,y,w,h)}function egg(x,y,col,s=1){X.save();X.translate(x,y);X.scale(s,s);X.fillStyle=col;X.strokeStyle='#171923';X.lineWidth=3;X.beginPath();X.moveTo(0,-17);X.bezierCurveTo(10,-14,12,0,10,8);X.bezierCurveTo(7,19,-8,19,-11,8);X.bezierCurveTo(-13,0,-9,-14,0,-17);X.closePath();X.fill();X.stroke();X.restore()}
function person(x,y,phase,run,holding,face){X.save();X.translate(x,y);X.scale(face,1);let s=Math.sin(phase)*(run?10:6);X.strokeStyle='#171923';X.lineWidth=7;X.lineCap='round';X.beginPath();X.moveTo(-6,18);X.lineTo(-9+s,42);X.moveTo(6,18);X.lineTo(9-s,42);X.stroke();X.fillStyle='#e45e51';X.fillRect(-12,-8,24,27);borderRect(-12,-8,24,27);X.fillStyle='#efbb8e';X.beginPath();X.arc(0,-21,12,0,7);X.fill();X.stroke();X.fillStyle='#432b20';X.fillRect(-11,-32,22,8);X.strokeStyle='#efbb8e';X.lineWidth=6;X.beginPath();X.moveTo(-10,0);X.lineTo(-20-s*.4,15);X.moveTo(10,0);X.lineTo(20+s*.4,15);X.stroke();if(holding)egg(20,-8,worlds[holding.world][5],.65);X.restore()}
function pet(d,x,y,ph){X.save();X.translate(x,y+Math.sin(ph)*2);X.fillStyle=d[2];X.strokeStyle='#171923';X.lineWidth=3;X.beginPath();X.ellipse(0,3,23,17,0,0,7);X.fill();X.stroke();X.fillStyle='#fff';X.beginPath();X.arc(-7,-3,4,0,7);X.arc(7,-3,4,0,7);X.fill();X.fillStyle='#111';X.beginPath();X.arc(-7,-3,2,0,7);X.arc(7,-3,2,0,7);X.fill();X.restore()}
function mother(i,x,y,angry){let col=['#c0804e','#68707d','#4b766b','#815037','#8355b8'][i];X.save();X.translate(x,y);X.fillStyle=col;X.strokeStyle='#171923';X.lineWidth=4;X.beginPath();X.ellipse(0,3,30,20,0,0,7);X.fill();X.stroke();X.beginPath();X.arc(24,-12,15,0,7);X.fill();X.stroke();X.fillStyle='#fff';X.beginPath();X.arc(29,-15,4,0,7);X.fill();X.restore();text(angry?'!':'Z Z',x+42,y-34,14,angry?'#ff5555':'#fff')}
function treadmill(){let x=570,y=100,w=270;X.fillStyle='#252a35';X.fillRect(x,y,w,75);borderRect(x,y,w,75);X.fillStyle='#0e1118';X.fillRect(x+14,y+40,w-28,22);let off=(performance.now()/4)%30;for(let i=0;i<9;i++){X.fillStyle='#aab2bf';X.fillRect(x+15+i*30-off,y+47,18,4)}X.strokeStyle='#11131c';X.lineWidth=8;X.beginPath();X.moveTo(x+w-35,y+45);X.lineTo(x+w-35,y-25);X.lineTo(x+w-110,y-25);X.stroke();X.fillStyle='#202638';X.fillRect(x-2,y+82,150,65);borderRect(x-2,y+82,150,65);text('SPEED '+game.speed,x+8,y+106,11,'#ffe56b','left');text('UPGRADE',x+8,y+126,10,'#fff','left');text('$'+game.upgrade*500,x+8,y+140,10,'#9cff91','left')}
function plot(){X.fillStyle='#73c866';X.fillRect(0,0,W,plotH);X.strokeStyle='#32231b';X.lineWidth=9;X.strokeRect(18,18,W-36,plotH-36);text('YOUR PET HABITAT',34,52,20,'#fff','left');let ph=performance.now()/180;game.pets.forEach((d,i)=>{let x=120+(i%4)*180,y=135+Math.floor(i/4)*70;pet(d,x,y,ph);text(d[0],x,y-27,9)});treadmill();game.eggs.filter(e=>!e.taken&&e.y<plotH).forEach(e=>{let g=Math.min(1,(Date.now()-e.planted)/e.duration);egg(e.x,e.y,worlds[e.world][5],.6+.6*g);text(e.ready<=Date.now()?'READY!':Math.ceil((e.ready-Date.now())/1000)+'s',e.x,e.y-26,9)})}
function world(i){let w=worlds[i],y=starts[i];X.fillStyle=w[1];X.fillRect(0,y,W,w[4]);if(i===0){for(let x=80;x<900;x+=160){X.fillStyle='#4e9e48';X.beginPath();X.arc(x,y+135,32,0,7);X.fill()}}if(i===1){for(let x=60;x<900;x+=130){X.fillStyle='#245d35';X.fillRect(x,y+95,12,150);X.beginPath();X.arc(x+6,y+95,38,0,7);X.fill()}}if(i===2){for(let x=80;x<900;x+=190){X.fillStyle='#1e4a45';X.beginPath();X.ellipse(x,y+220,65,28,0,0,7);X.fill()}}if(i===3){X.fillStyle='#e5b96c';X.beginPath();X.moveTo(560,y+300);X.lineTo(700,y+90);X.lineTo(840,y+300);X.closePath();X.fill();X.strokeStyle='#815529';X.lineWidth=5;X.stroke()}if(i===4){for(let k=0;k<80;k++){X.fillStyle='#eee';X.fillRect((k*97)%W,y+80+(k*41)%(w[4]-100),2,2)}}let m=mothers[i];mother(i,m.x,m.y,m.angry);m.nests.forEach(n=>{if(n.filled){let ex=m.homeX+Math.cos(n.a)*125,ey=m.homeY+Math.sin(n.a)*75;egg(ex,ey,w[5],.8)}})}
function inSafe(){return p.y>=plotH&&p.y<base}function onTread(){return p.x>570&&p.x<840&&p.y<180}function interact(){if(game.holding)return;for(let m of mothers){for(let n of m.nests){let ex=m.homeX+Math.cos(n.a)*125,ey=m.homeY+Math.sin(n.a)*75;if(n.filled&&Math.hypot(p.x-ex,p.y-ey)<45){n.filled=false;game.holding={world:m.world};m.angry=true;m.sleep=false;setTimeout(()=>n.filled=true,2500);pop('🥚 EGG STOLEN!');return}}}for(let e of game.eggs){if(!e.taken&&e.ready<=Date.now()&&Math.hypot(p.x-e.x,p.y-e.y)<45){game.pets.push(defs[e.pet]);e.taken=true;pop('🎉 '+defs[e.pet][0]+'!');return}}}C.addEventListener('click',e=>{let r=C.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H+cam;if(x>568&&x<848&&y>178&&y<260){let cost=game.upgrade*500;if(game.cash>=cost){game.cash-=cost;game.upgrade++;pop('TREADMILL UPGRADED!')}return}if(!game.holding)return;if(y<plotH-20&&x>25&&x<W-25){let wi=game.holding.world,pi=Math.floor(Math.random()*defs.length),dur=worlds[wi][6]*1000*(1+defs[pi][1]/40);game.eggs.push({world:wi,x,y,planted:Date.now(),duration:dur,ready:Date.now()+dur,pet:pi,taken:false});game.holding=null;pop('🥚 EGG PLANTED!')}});
function update(dt){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),tr=onTread(),spd=150+Math.max(0,game.speed-1)*18;if(dx||dy){let l=Math.hypot(dx,dy);p.vx=dx/l*spd;p.vy=dy/l*spd;p.walk+=dt*(tr?15:8);if(dx)p.face=dx>0?1:-1}else{p.vx=0;p.vy=0;if(tr)p.walk+=dt*10}p.x=Math.max(35,Math.min(925,p.x+p.vx*dt));p.y=Math.max(0,Math.min(totalH-35,p.y+p.vy*dt));if(tr){game.treadTime+=dt;if(game.treadTime>=1){let n=Math.floor(game.treadTime);game.speed+=n;game.treadTime-=n;fl('+'+n+' SPEED',p.x,p.y-45,'#66e8ff')}}else game.treadTime=0;mothers.forEach(m=>{if(inSafe()&&m.angry){m.angry=false;m.sleep=true;m.x=m.homeX;m.y=m.homeY}if(m.angry){let dx=p.x-m.x,dy=p.y-m.y,l=Math.hypot(dx,dy)||1,dist=Math.hypot(m.x-m.homeX,m.y-m.homeY),v=worlds[m.world][3]+dist*.24;m.x+=dx/l*v*dt;m.y+=dy/l*v*dt;if(l<40&&game.holding){game.eggs.push({world:m.world,x:p.x,y:p.y,planted:Date.now(),duration:worlds[m.world][6]*1000,ready:Date.now()+worlds[m.world][6]*1000,pet:0,taken:false});game.holding=null;m.angry=false;pop('💥 CAUGHT! EGG DROPPED!')}}});let inc=game.pets.reduce((s,d)=>s+d[1],0);game.cash+=inc*dt;if(inc&&Math.random()<dt*1.5){let d=game.pets[Math.floor(Math.random()*game.pets.length)];fl('+$'+d[1],100+Math.random()*760,105+Math.random()*120)}if(Date.now()-game.lastReset>=300000){game.lastReset=Date.now();mothers.forEach(m=>{m.nests.forEach(n=>n.filled=true);m.angry=false;m.sleep=true;m.x=m.homeX;m.y=m.homeY});game.eggs=[];pop('🌙 NIGHT RESET')}}
function render(){fit();X.clearRect(0,0,innerWidth,innerHeight);cam+=(p.y-H*.55-cam)*.12;cam=Math.max(0,Math.min(totalH-H,cam));X.save();X.translate(0,-cam);plot();X.fillStyle='#73c866';X.fillRect(0,plotH,W,safeH);X.strokeStyle='#22251d';X.setLineDash([8,8]);X.beginPath();X.moveTo(0,plotH);X.lineTo(W,plotH);X.stroke();X.setLineDash([]);for(let i=0;i<worlds.length;i++)world(i);if(game.holding)egg(p.x+20,p.y-8,worlds[game.holding.world][5],.65);person(p.x,p.y,p.walk,onTread(),!!game.holding,p.face);drawFloats();X.restore();cash.textContent=Math.floor(game.cash);pets.textContent=game.pets.length;speed.textContent=game.speed;let left=Math.max(0,300-(Date.now()-game.lastReset)/1000);night.textContent=Math.floor(left/60)+':'+String(Math.ceil(left%60)).padStart(2,'0');let idx=worlds.findIndex((w,i)=>p.y>=starts[i]&&p.y<starts[i]+w[4]);let name=p.y<plotH?'YOUR PLOT':inSafe()?'SAFE AREA':idx>=0?worlds[idx][0]:'MEADOW';if(name!==lastArea){lastArea=name;pop(name)}}function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;try{update(dt);render()}catch(e){console.error(e)}requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
